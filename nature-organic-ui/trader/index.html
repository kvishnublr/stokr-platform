<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOKR Trader Terminal - Nature Organic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @keyframes organicWave { 0%, 100% { transform: translateY(0px) translateX(0px); } 25% { transform: translateY(-8px) translateX(5px); } 50% { transform: translateY(0px) translateX(10px); } 75% { transform: translateY(8px) translateX(5px); } }
        @keyframes growthPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.8; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #f5faf8, #f0f8f2, #faf5f0, #f8f0f5);
            background-size: 400% 400%;
            animation: organicWave 30s ease infinite;
            color: #2d5a4a;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #ffffff 0%, #f8faf8 100%);
            border-right: 2px solid #d4a574;
            padding: 24px 16px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 20;
            box-shadow: 0 8px 32px rgba(45, 106, 79, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4a574;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-group {
            margin-bottom: 24px;
        }

        .menu-group-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2d6a4f;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(45, 106, 79, 0.08);
            border-radius: 6px;
            border-left: 3px solid #2d6a4f;
        }

        .menu-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.4s;
            color: #5a7a6a;
            border-left: 3px solid transparent;
            font-weight: 600;
            border: none;
            width: 100%;
            text-align: left;
        }

        .menu-item:hover {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.12), rgba(156, 175, 136, 0.1));
            color: #2d6a4f;
            border-left-color: #2d6a4f;
            transform: translateX(6px);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.18), rgba(212, 165, 116, 0.12));
            color: #2d6a4f;
            border-left-color: #2d6a4f;
            animation: growthPulse 3s ease-in-out infinite;
        }

        .main-content {
            margin-left: 280px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 2px solid #d4a574;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(45, 106, 79, 0.08);
        }

        .breadcrumb {
            font-size: 13px;
            background: linear-gradient(90deg, #2d6a4f, #386395, #d4a574);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(45, 106, 79, 0.12), rgba(56, 99, 149, 0.1));
            padding: 8px 14px;
            border-radius: 20px;
            color: #2d6a4f;
            font-weight: 700;
            font-size: 12px;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            animation: slideInUp 0.6s ease-out;
        }

        .page-title {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 50%, #d4a574 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            font-size: 15px;
            background: linear-gradient(90deg, #386395, #9caf88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 32px;
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 248, 0.95));
            border: 2px solid #d4a574;
            border-radius: 16px;
            padding: 28px;
            transition: all 0.5s;
            box-shadow: 0 10px 40px rgba(45, 106, 79, 0.08);
            animation: slideInUp 0.8s ease-out;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #2d6a4f;
            box-shadow: 0 30px 80px rgba(45, 106, 79, 0.15);
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #d4a574;
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric:last-child { border-bottom: none; }

        .metric-label {
            font-size: 13px;
            color: #6a8a7a;
            font-weight: 700;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.08), rgba(56, 99, 149, 0.08));
            border-bottom: 2px solid #d4a574;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:hover {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.05), rgba(56, 99, 149, 0.05));
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            border-bottom: 2px solid #d4a574;
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6a8a7a;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 3px solid transparent;
            transition: all 0.4s;
        }

        .tab-btn.active {
            color: #2d6a4f;
            border-bottom-color: #2d6a4f;
        }

        .hidden { display: none; }

        .chart-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 248, 0.95));
            border: 2px solid #d4a574;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(45, 106, 79, 0.1);
        }

        .chart-container h3 {
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 800;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🌿 STOKR</div>

        <div class="menu-group">
            <div class="menu-group-title">📊 Dashboard</div>
            <button class="menu-item active" onclick="loadPage('dashboard')">Main Dashboard</button>
            <button class="menu-item" onclick="loadPage('overview')">Portfolio Overview</button>
        </div>

        <div class="menu-group">
            <div class="menu-group-title">🔄 Trading</div>
            <button class="menu-item" onclick="loadPage('terminal')">Intraday Terminal</button>
            <button class="menu-item" onclick="loadPage('positions')">Open Positions</button>
            <button class="menu-item" onclick="loadPage('orders')">Orders</button>
            <button class="menu-item" onclick="loadPage('executions')">Executions</button>
        </div>

        <div class="menu-group">
            <div class="menu-group-title">🎯 Strategies</div>
            <button class="menu-item" onclick="loadPage('watchlist')">Watchlist</button>
            <button class="menu-item" onclick="loadPage('strategies')">Strategy Manager</button>
            <button class="menu-item" onclick="loadPage('signals')">Signal Monitor</button>
            <button class="menu-item" onclick="loadPage('backtests')">Backtests</button>
        </div>

        <div class="menu-group">
            <div class="menu-group-title">⚙️ Settings</div>
            <button class="menu-item" onclick="loadPage('broker')">Broker Connect</button>
            <button class="menu-item" onclick="loadPage('settings')">Preferences</button>
            <button class="menu-item" onclick="loadPage('profile')">Profile</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="breadcrumb">🌿 NATURE INSPIRED ORGANIC TRADER TERMINAL 🌿</div>
            <div id="stokrStatusBar" style="display: flex; gap: 16px;">
                <div class="status-item"><span style="width: 10px; height: 10px; background: #386395; border-radius: 50%;"></span>Connecting…</div>
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Content loads here -->
        </div>
    </div>

    <script src="stokr-panel.js"></script>
    <script>
        StokrPanel.createTraderApp();
    </script>

</body>
</html>
