# ========================================
# PROMETHEUS CONFIGURATION FOR RELEASE_V2
# Advanced 100-Trader Monitoring System
# ========================================

global:
  scrape_interval: 15s      # Default scrape interval
  evaluation_interval: 15s  # How often to evaluate rules
  external_labels:
    environment: 'v2-staging'
    application: 'stokr-platform'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

# Rule files
rule_files:
  - 'alerts.yml'
  - 'recording_rules.yml'

# Scrape configurations
scrape_configs:
  # ===== PRIMARY APPLICATION METRICS =====
  - job_name: 'stokr-platform'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    labels:
      service: 'stokr-platform'
      environment: 'production'

  # ===== DATABASE METRICS (PostgreSQL) =====
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s
    labels:
      service: 'database'

  # ===== REDIS METRICS =====
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s
    labels:
      service: 'cache'

  # ===== RABBITMQ METRICS =====
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['localhost:15692']
    scrape_interval: 30s
    labels:
      service: 'message-queue'

  # ===== NODE EXPORTER (SYSTEM METRICS) =====
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s
    labels:
      service: 'infrastructure'

  # ===== JAEGER METRICS =====
  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:14269']
    scrape_interval: 30s
    labels:
      service: 'tracing'

# Service discovery (if using Kubernetes)
# Service discovery will be configured here for k8s deployments
