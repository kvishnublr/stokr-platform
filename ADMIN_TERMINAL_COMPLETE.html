<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOKR Admin Dashboard - Nature Organic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @keyframes organicWave { 0%, 100% { transform: translateY(0px) translateX(0px); } 25% { transform: translateY(-8px) translateX(5px); } 50% { transform: translateY(0px) translateX(10px); } 75% { transform: translateY(8px) translateX(5px); } }
        @keyframes growthPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.8; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #f5faf8, #f0f8f2, #faf5f0, #f8f0f5);
            background-size: 400% 400%;
            animation: organicWave 30s ease infinite;
            color: #2d5a4a;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #ffffff 0%, #f8faf8 100%);
            border-right: 2px solid #d4a574;
            padding: 24px 16px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 20;
            box-shadow: 0 8px 32px rgba(45, 106, 79, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4a574;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-group {
            margin-bottom: 24px;
        }

        .menu-group-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2d6a4f;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(45, 106, 79, 0.08);
            border-radius: 6px;
            border-left: 3px solid #2d6a4f;
        }

        .menu-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.4s;
            color: #5a7a6a;
            border-left: 3px solid transparent;
            font-weight: 600;
            border: none;
            width: 100%;
            text-align: left;
        }

        .menu-item:hover {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.12), rgba(156, 175, 136, 0.1));
            color: #2d6a4f;
            border-left-color: #2d6a4f;
            transform: translateX(6px);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.18), rgba(212, 165, 116, 0.12));
            color: #2d6a4f;
            border-left-color: #2d6a4f;
            animation: growthPulse 3s ease-in-out infinite;
        }

        .main-content {
            margin-left: 280px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 2px solid #d4a574;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(45, 106, 79, 0.08);
        }

        .breadcrumb {
            font-size: 13px;
            background: linear-gradient(90deg, #2d6a4f, #386395, #d4a574);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(45, 106, 79, 0.12), rgba(56, 99, 149, 0.1));
            padding: 8px 14px;
            border-radius: 20px;
            color: #2d6a4f;
            font-weight: 700;
            font-size: 12px;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            animation: slideInUp 0.6s ease-out;
        }

        .page-title {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 50%, #d4a574 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            font-size: 15px;
            background: linear-gradient(90deg, #386395, #9caf88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 32px;
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 248, 0.95));
            border: 2px solid #d4a574;
            border-radius: 16px;
            padding: 28px;
            transition: all 0.5s;
            box-shadow: 0 10px 40px rgba(45, 106, 79, 0.08);
            animation: slideInUp 0.8s ease-out;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #2d6a4f;
            box-shadow: 0 30px 80px rgba(45, 106, 79, 0.15);
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #d4a574;
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric:last-child { border-bottom: none; }

        .metric-label {
            font-size: 13px;
            color: #6a8a7a;
            font-weight: 700;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.08), rgba(56, 99, 149, 0.08));
            border-bottom: 2px solid #d4a574;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:hover {
            background: linear-gradient(90deg, rgba(45, 106, 79, 0.05), rgba(56, 99, 149, 0.05));
        }

        .chart-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 248, 0.95));
            border: 2px solid #d4a574;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(45, 106, 79, 0.1);
        }

        .chart-container h3 {
            background: linear-gradient(135deg, #2d6a4f, #386395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 800;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }
    </style>
</head>

        function loadPage(pageName) {
            const page = pages[pageName];
            const contentArea = document.getElementById('contentArea');

            contentArea.innerHTML = `
                <div class="page-title">${page.title}</div>
                <div class="page-subtitle">${page.subtitle}</div>
                ${page.content}
            `;

            // Update active menu item
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');

            // Create chart if on dashboard
            if (pageName === 'dashboard') {
                setTimeout(() => createChart(), 100);
            }
        }

        function createChart() {
            const canvas = document.getElementById('chartCanvas');
            if (canvas) {
                new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: ['9:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00'],
                        datasets: [{
                            label: 'Platform Load (%)',
                            data: [35, 42, 48, 52, 58, 65, 62, 70, 68, 75, 72, 65],
                            borderColor: '#2d6a4f',
                            backgroundColor: 'rgba(45, 106, 79, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#386395'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#2d6a4f', font: { weight: 'bold' } } }
                        },
                        scales: {
                            y: { ticks: { color: '#6a8a7a' }, grid: { color: 'rgba(45, 106, 79, 0.08)' } },
                            x: { ticks: { color: '#6a8a7a' }, grid: { color: 'rgba(45, 106, 79, 0.08)' } }
                        }
                    }
                });
            }
        }

        // Load dashboard on init
        window.addEventListener('load', () => loadPage('dashboard'));
    </script>
</body>
