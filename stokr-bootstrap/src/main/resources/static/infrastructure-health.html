<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Health Center - Stokr P0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            border-radius: 8px;
            font-weight: 600;
        }

        .status-badge.critical {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }

        .status-badge.warning {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
        }

        .pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }

        /* System Overview - Visual Topology */
        .topology {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .component {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .component::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4caf50, transparent);
        }

        .component.critical {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .component.critical::before {
            background: linear-gradient(90deg, #f44336, transparent);
        }

        .component.warning {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }

        .component.warning::before {
            background: linear-gradient(90deg, #ffc107, transparent);
        }

        .component:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .component-name {
            font-size: 16px;
            font-weight: 600;
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            animation: blink 2s infinite;
        }

        .status-indicator.offline {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }

        .status-indicator.warning {
            background: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .metrics {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .metric-label {
            color: #b0bec5;
        }

        .metric-value {
            font-weight: 600;
            color: #4caf50;
        }

        .metric.critical .metric-value {
            color: #f44336;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #45a049);
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #ffc107, #ffb300);
        }

        .progress-fill.critical {
            background: linear-gradient(90deg, #f44336, #da190b);
        }

        /* System Grid */
        .system-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(76, 175, 80, 0.3);
            color: #fff;
        }

        /* Gauges */
        .gauges {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .gauge {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .gauge-title {
            font-size: 13px;
            color: #b0bec5;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .gauge-value {
            font-size: 32px;
            font-weight: 700;
            color: #4caf50;
            margin-bottom: 10px;
        }

        .gauge-value.warning {
            color: #ffc107;
        }

        .gauge-value.critical {
            color: #f44336;
        }

        .gauge-unit {
            font-size: 12px;
            color: #b0bec5;
        }

        /* Issues Panel */
        .issues-panel {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            display: none;
        }

        .issues-panel.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .issues-title {
            font-size: 18px;
            font-weight: 600;
            color: #f44336;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .issue-item {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #f44336;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .issue-severity {
            display: inline-block;
            padding: 2px 8px;
            background: #f44336;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }

        .issue-text {
            font-size: 13px;
            color: #e0e0e0;
        }

        .issue-time {
            font-size: 11px;
            color: #b0bec5;
            margin-top: 5px;
        }

        /* Timeline */
        .timeline {
            margin-top: 30px;
        }

        .timeline-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .timeline-dot.critical {
            background: #f44336;
        }

        .timeline-content {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 2px solid rgba(76, 175, 80, 0.3);
        }

        .timeline-time {
            font-size: 12px;
            color: #b0bec5;
            margin-bottom: 5px;
        }

        .timeline-text {
            font-size: 13px;
            color: #e0e0e0;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(76, 175, 80, 0.3);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }

        .refresh-time {
            font-size: 12px;
            color: #b0bec5;
            align-self: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .topology {
                grid-template-columns: 1fr;
            }

            .gauges {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🏗️ Infrastructure Health Center</h1>
                <p style="color: #b0bec5; margin-top: 5px;">Real-time system monitoring & issue detection</p>
            </div>
            <div class="status-badge" id="overallStatus">
                <div class="pulse"></div>
                <span>HEALTHY</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button onclick="fetchHealthData()">🔄 Refresh Now</button>
            <button onclick="toggleAutoRefresh()">⚙️ Auto Refresh: ON</button>
            <span class="refresh-time" id="lastRefresh">Last updated: just now</span>
        </div>

        <!-- System Topology -->
        <div class="system-section">
            <h2 class="section-title">🔌 System Components</h2>
            <div class="topology" id="topology">
                <!-- Components will be populated here -->
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="system-section">
            <h2 class="section-title">📊 Key Metrics</h2>
            <div class="gauges" id="gauges">
                <!-- Gauges will be populated here -->
            </div>
        </div>

        <!-- Issues Panel -->
        <div class="issues-panel" id="issuesPanel">
            <div class="issues-title">
                ⚠️ CRITICAL ISSUES DETECTED
            </div>
            <div id="issuesList"></div>
        </div>

        <!-- Timeline -->
        <div class="system-section">
            <h2 class="section-title">📈 Event Timeline</h2>
            <div class="timeline" id="timeline">
                <!-- Timeline events will be populated here -->
            </div>
        </div>
    </div>

    <script>
        let autoRefresh = true;
        let refreshInterval;

        // Sample health data structure
        const healthData = {
            components: [
                { name: 'Market Feed', status: 'closed', latency: '-', type: 'market' },
                { name: 'OMS', status: 'ready', latency: '37.80%', type: 'core' },
                { name: 'Redis', status: 'connected', latency: '15ms', type: 'cache' },
                { name: 'RabbitMQ', status: 'connected', latency: '12ms', type: 'queue' },
                { name: 'PostgreSQL', status: 'connected', latency: '8ms', type: 'database' },
                { name: 'Signal Engine', status: 'running', latency: 'active', type: 'processing' },
                { name: 'Broker Rail', status: 'connected', latency: '45ms', type: 'broker' },
                { name: 'Kill Switch', status: 'armed', latency: 'active', type: 'safety' }
            ],
            metrics: [
                { label: 'CPU Usage', value: 34, unit: '%' },
                { label: 'Memory Usage', value: 62, unit: '%' },
                { label: 'Disk I/O', value: 28, unit: '%' },
                { label: 'Network', value: 18, unit: '%' }
            ],
            issues: [
                { severity: 'WARNING', text: 'Market Feed is CLOSED - trading halted', time: '13:35' },
                { severity: 'INFO', text: 'Kill Switch ARMED - execution plane hot', time: '13:30' }
            ],
            timeline: [
                { time: '13:35', text: 'Market Feed closed - automatic halt triggered', critical: false },
                { time: '13:30', text: 'Kill Switch activated - safety mechanism engaged', critical: false },
                { time: '13:20', text: 'OMS load at 37.80% - monitoring increased', critical: false },
                { time: '13:10', text: 'All systems nominal - all components connected', critical: false }
            ]
        };

        // Get status color
        function getStatusClass(status) {
            const normalStatuses = ['connected', 'ready', 'running', 'armed'];
            const warningStatuses = ['closed'];

            if (warningStatuses.includes(status)) return 'warning';
            if (!normalStatuses.includes(status)) return 'critical';
            return '';
        }

        // Render topology
        function renderTopology() {
            const topology = document.getElementById('topology');
            topology.innerHTML = '';

            healthData.components.forEach(comp => {
                const statusClass = getStatusClass(comp.status);
                const html = `
                    <div class="component ${statusClass}">
                        <div class="component-header">
                            <span class="component-name">${comp.name}</span>
                            <div class="status-indicator ${statusClass}"></div>
                        </div>
                        <div class="metrics">
                            <div class="metric">
                                <span class="metric-label">Status:</span>
                                <span class="metric-value">${comp.status.toUpperCase()}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Latency/Load:</span>
                                <span class="metric-value">${comp.latency}</span>
                            </div>
                        </div>
                    </div>
                `;
                topology.innerHTML += html;
            });
        }

        // Render gauges
        function renderGauges() {
            const gauges = document.getElementById('gauges');
            gauges.innerHTML = '';

            healthData.metrics.forEach(metric => {
                const statusClass = metric.value > 80 ? 'critical' : metric.value > 60 ? 'warning' : '';
                const html = `
                    <div class="gauge">
                        <div class="gauge-title">${metric.label}</div>
                        <div class="gauge-value ${statusClass}">${metric.value}</div>
                        <div class="gauge-unit">${metric.unit}</div>
                        <div class="progress-bar">
                            <div class="progress-fill ${statusClass}" style="width: ${metric.value}%"></div>
                        </div>
                    </div>
                `;
                gauges.innerHTML += html;
            });
        }

        // Render issues
        function renderIssues() {
            const issuesPanel = document.getElementById('issuesPanel');
            const issuesList = document.getElementById('issuesList');

            const criticalIssues = healthData.issues.filter(i => i.severity === 'CRITICAL');

            if (criticalIssues.length > 0) {
                issuesPanel.classList.add('show');
                issuesList.innerHTML = criticalIssues.map(issue => `
                    <div class="issue-item">
                        <span class="issue-severity">${issue.severity}</span>
                        <span class="issue-text">${issue.text}</span>
                        <div class="issue-time">${issue.time}</div>
                    </div>
                `).join('');
            } else {
                issuesPanel.classList.remove('show');
            }
        }

        // Render timeline
        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            healthData.timeline.forEach((item, index) => {
                const html = `
                    <div class="timeline-item" style="animation-delay: ${index * 0.1}s">
                        <div class="timeline-dot ${item.critical ? 'critical' : ''}"></div>
                        <div class="timeline-content">
                            <div class="timeline-time">${item.time}</div>
                            <div class="timeline-text">${item.text}</div>
                        </div>
                    </div>
                `;
                timeline.innerHTML += html;
            });
        }

        // Fetch health data
        function fetchHealthData() {
            console.log('Fetching health data...');
            renderTopology();
            renderGauges();
            renderIssues();
            renderTimeline();

            document.getElementById('lastRefresh').textContent =
                `Last updated: ${new Date().toLocaleTimeString()}`;

            // Update overall status
            const hasCritical = healthData.issues.some(i => i.severity === 'CRITICAL');
            const overall = document.getElementById('overallStatus');
            if (hasCritical) {
                overall.className = 'status-badge critical';
                overall.innerHTML = '<div class="pulse" style="background: #f44336;"></div><span>CRITICAL</span>';
            } else {
                overall.className = 'status-badge';
                overall.innerHTML = '<div class="pulse"></div><span>HEALTHY</span>';
            }
        }

        // Toggle auto refresh
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = event.target;
            btn.textContent = autoRefresh ? '⚙️ Auto Refresh: ON' : '⚙️ Auto Refresh: OFF';

            if (autoRefresh) {
                refreshInterval = setInterval(fetchHealthData, 5000);
            } else {
                clearInterval(refreshInterval);
            }
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', function() {
            fetchHealthData();
            refreshInterval = setInterval(fetchHealthData, 5000);
        });
    </script>
</body>
</html>
