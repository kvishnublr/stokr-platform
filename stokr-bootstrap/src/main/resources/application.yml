server:
  port: 8080
  # Detect HTTPS behind reverse proxy (nginx sends X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-For).
  # This is required for Zerodha OAuth to work behind HTTPS reverse proxy.
  forward-headers-strategy: framework
  tomcat:
    # Tuned for t2/t3.micro. Raise threads.max to 100 on t3.medium+.
    threads:
      max: ${TOMCAT_MAX_THREADS:30}
      min-spare: ${TOMCAT_MIN_THREADS:5}
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  application:
    name: stokr-platform
  jackson:
    time-zone: Asia/Kolkata
  mail:
    # spring.mail.host is intentionally omitted here so an unset host does not create a broken JavaMailSender.
    # Use SPRING_MAIL_HOST / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD in repo-root .env (see .env.example),
    # or dotted spring.mail.* in .env. When only SPRING_MAIL_HOST is set, StokrJavaMailSenderFallbackConfiguration
    # supplies JavaMailSender if Boot mail auto-config does not.
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
  # Load repo-root .env in IntelliJ / CLI without hand-copying env vars (KEY=value = Java properties).
  # CWD is often repo root or stokr-bootstrap — both paths are tried, optional if missing.
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stokr_platform}
    # Defaults match .env.example. Docker Compose sets DB_USER/DB_PASSWORD for the api service.
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      # Tuned for t2/t3.micro (1 vCPU, 1GB RAM). Raise to 15 on t3.medium+.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      # Kill connections held > 60s (runaway queries on slow hardware)
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Set false in .env when RabbitMQ is not running locally (API + login without full stack).
        auto-startup: ${STOKR_RABBIT_LISTENERS_ENABLED:true}
      direct:
        auto-startup: ${STOKR_RABBIT_LISTENERS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      # Off by default: without RabbitMQ, actuator health was opening TCP to :5672 and logging a full stack trace.
      # Set true in .env / Docker when brokers and AMQP are part of your deployment.
      enabled: ${STOKR_RABBIT_HEALTH_ENABLED:false}
    mail:
      # Off by default: partial SMTP config (e.g. host set, no password) makes MailHealthIndicator fail and spam WARNs.
      # Set STOKR_MAIL_HEALTH_ENABLED=true when SMTP is fully reachable (production, Mailtrap, or local Mailpit with matching auth).
      # Mailpit: use SPRING_MAIL_SMTP_AUTH=false and SPRING_MAIL_SMTP_STARTTLS=false; From address still requires SPRING_MAIL_USERNAME.
      enabled: ${STOKR_MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

stokr:
  deploy:
    git-commit: ${STOKR_GIT_COMMIT:unknown}
    branch: ${STOKR_DEPLOY_BRANCH:Release_v1}
  marketdata:
    integrity:
      enabled: ${STOKR_MARKETDATA_INTEGRITY_ENABLED:true}
    feed-health:
      poll-ms: ${STOKR_FEED_HEALTH_POLL_MS:30000}
      equity-stale-seconds: ${STOKR_FEED_HEALTH_EQUITY_STALE_SEC:120}
      index-stale-seconds: ${STOKR_FEED_HEALTH_INDEX_STALE_SEC:120}
      tick-stale-seconds: ${STOKR_FEED_HEALTH_TICK_STALE_SEC:30}
      outage-error-seconds: ${STOKR_FEED_HEALTH_OUTAGE_ERROR_SEC:300}
  broker-truth:
    poll-ms: ${STOKR_BROKER_TRUTH_POLL_MS:3000}
    stale-ms: ${STOKR_BROKER_TRUTH_STALE_MS:15000}
  rabbit:
    # Gates @RabbitListener registration (see stokr-execution messaging). Same env as spring.rabbitmq.listener.*.auto-startup.
    # false = no AMQP consumer reconnect loop when RabbitMQ is down (typical local IntelliJ + DB only).
    listeners-enabled: ${STOKR_RABBIT_LISTENERS_ENABLED:true}
  admin:
    ops:
      sse-tick-ms: ${STOKR_ADMIN_OPS_SSE_TICK_MS:3000}
  # Single env: STOKR_CORS_ALLOWED_ORIGINS (comma-separated). Edit repo-root .env only — local + Docker + IntelliJ all load it.
  cors:
    allowed-origins: ${STOKR_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
  auth:
    login:
      max-failed-attempts: ${STOKR_AUTH_MAX_FAILED:5}
      lock-duration-minutes: ${STOKR_AUTH_LOCK_MINUTES:15}
      password-reset-hours-valid: ${STOKR_AUTH_PW_RESET_HOURS:1}
    # When spring.mail.host is unset, verification URL is logged at WARN for local dev (override if UI runs on another port).
    email-verification-base-url: ${STOKR_EMAIL_VERIFY_BASE_URL:http://localhost:5173}
    # Minimum seconds between authenticated resend-verification requests (same user). 0 = disabled (local dev).
    verification-resend-cooldown-seconds: ${STOKR_AUTH_VERIFY_RESEND_COOLDOWN:0}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-use-long-random-secret-for-development-only}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  risk:
    zone: ${STOKR_RISK_ZONE:Asia/Kolkata}
    max-order-qty: ${STOKR_RISK_MAX_ORDER_QTY:100000}
    max-order-notional: ${STOKR_RISK_MAX_ORDER_NOTIONAL:50000000}
    max-open-positions: ${STOKR_RISK_MAX_OPEN_POSITIONS:100}
    order-cooldown-ms: ${STOKR_RISK_ORDER_COOLDOWN_MS:0}
    max-trades-per-day: ${STOKR_RISK_MAX_TRADES_PER_DAY:200}
    max-daily-loss-amount: ${STOKR_RISK_MAX_DAILY_LOSS_AMOUNT:0}
    max-portfolio-drawdown-pct: ${STOKR_RISK_MAX_PORTFOLIO_DRAWDOWN_PCT:0}
    max-strategy-notional: ${STOKR_RISK_MAX_STRATEGY_NOTIONAL:0}
    max-orders-per-minute: ${STOKR_RISK_MAX_ORDERS_PER_MINUTE:0}
    volatility-halt-atr-close-ratio: ${STOKR_RISK_VOLATILITY_HALT_ATR_CLOSE_RATIO:0}
    trading-window-start: ${STOKR_RISK_TRADING_WINDOW_START:09:25}
    trading-window-end: ${STOKR_RISK_TRADING_WINDOW_END:14:45}
  catalog:
    scan:
      enabled: ${STOKR_CATALOG_SCAN_ENABLED:true}
      poll-ms: ${STOKR_CATALOG_SCAN_POLL_MS:60000}
    # How long resolved bindings + universe symbols are cached in memory before re-fetching from DB.
    # Default 5 min: a 60s scan cycle costs 0 DB queries for binding resolution.
    universe-cache-seconds: ${STOKR_CATALOG_UNIVERSE_CACHE_SECONDS:300}
  backfill:
    # Disabled by default — backfill hammers DB with 1000s of queries across all symbols.
    # Enable explicitly on a healthy instance: STOKR_BACKFILL_ENABLED=true
    enabled: ${STOKR_BACKFILL_ENABLED:false}
    # Keep lookback short to avoid hours-long runs on t2/t3.micro
    lookback-days: ${STOKR_BACKFILL_LOOKBACK_DAYS:30}
  strategy:
    # Per-strategy execution mode: LIVE, PAPER, DRY_RUN, DISABLED
    execution-modes:
      allow-live: ${STOKR_EXECUTION_MODES_ALLOW_LIVE:false}
      live-validated: ${STOKR_EXECUTION_MODES_LIVE_VALIDATED:}
      GAP_FILL: ${STOKR_EXEC_MODE_GAP_FILL:PAPER}
      SECTOR_LAGGARD: ${STOKR_EXEC_MODE_SECTOR_LAGGARD:DISABLED}
      NSE_SPIKE_DETECTION: ${STOKR_EXEC_MODE_NSE_SPIKE:DRY_RUN}
      EARLY_BREAKOUT: ${STOKR_EXEC_MODE_EARLY_BREAKOUT:DRY_RUN}
      VWAP_BOUNCE: ${STOKR_EXEC_MODE_VWAP_BOUNCE:DRY_RUN}
      INDEX_HUNT: ${STOKR_EXEC_MODE_INDEX_HUNT:DRY_RUN}
      ADV_CASH: ${STOKR_EXEC_MODE_ADV_CASH:DRY_RUN}
      S3_VWAP_RETEST: ${STOKR_EXEC_MODE_S3:DISABLED}
      S7_RANGE_FADE: ${STOKR_EXEC_MODE_S7:DISABLED}
    safe-startup:
      enabled: ${STOKR_SAFE_STARTUP_ENABLED:true}
      min-warmup-seconds: ${STOKR_SAFE_STARTUP_WARMUP_SEC:120}
    session-summary:
      cron: ${STOKR_SESSION_SUMMARY_CRON:0 35 15 * * MON-FRI}
    lifecycle:
      emergency:
        spread-pct: ${STOKR_LIFECYCLE_EMERGENCY_SPREAD_PCT:0.50}
        candle-stale-seconds: ${STOKR_LIFECYCLE_EMERGENCY_CANDLE_STALE_SEC:120}
        volume-vacuum-ratio: ${STOKR_LIFECYCLE_EMERGENCY_VOLUME_VACUUM:0.10}
    # Drop new signals when reference price exceeds ceiling (INR). 0 or negative = disabled.
    max-entry-price: ${STOKR_STRATEGY_MAX_ENTRY_PRICE:5000}
    quality-gate:
      enabled: ${STOKR_STRATEGY_QUALITY_GATE_ENABLED:true}
      min-confidence: ${STOKR_STRATEGY_MIN_CONFIDENCE:0.55}
      min-risk-reward: ${STOKR_STRATEGY_MIN_RR:1.2}
    signal:
      quality:
        # Institutional-grade signal quality gates
        min-rr: ${STOKR_SIGNAL_QUALITY_MIN_RR:1.5}
        min-candle-body-pct: ${STOKR_SIGNAL_QUALITY_MIN_CANDLE_BODY_PCT:0.003}
        max-atr-compression-pct: ${STOKR_SIGNAL_QUALITY_MAX_ATR_COMPRESSION_PCT:0.005}
        max-atr-expansion-pct: ${STOKR_SIGNAL_QUALITY_MAX_ATR_EXPANSION_PCT:0.03}
        stale-candle-seconds: ${STOKR_SIGNAL_QUALITY_STALE_CANDLE_SECONDS:60}
        min-volume-ratio: ${STOKR_SIGNAL_QUALITY_MIN_VOLUME_RATIO:0.8}
        max-concurrent-trades: ${STOKR_SIGNAL_QUALITY_MAX_CONCURRENT_TRADES:10}
      cooldown-seconds: ${STOKR_SIGNAL_COOLDOWN_SECONDS:900}
    signal-dedup:
      cooldown-minutes: ${STOKR_STRATEGY_SIGNAL_DEDUP_MINUTES:15}
    exit:
      breakeven-enabled: ${STOKR_STRATEGY_BREAKEVEN_EXIT_ENABLED:true}
      breakeven-mfe-ratio: ${STOKR_STRATEGY_BREAKEVEN_MFE_RATIO:0.5}
      auto-exit-enabled: ${STOKR_STRATEGY_AUTO_EXIT_ENABLED:true}
      auto-exit-on-breakeven: ${STOKR_STRATEGY_AUTO_EXIT_BREAKEVEN:true}
    replay:
      dispatch-to-oms: ${STOKR_STRATEGY_REPLAY_DISPATCH_OMS:false}
    subscription-default-symbol: ${STOKR_STRATEGY_SUBSCRIPTION_SYMBOL:NIFTY_FUT}
    mean-reversion:
      enabled: ${STOKR_STRATEGY_MR_ENABLED:true}
    poll-ms: ${STOKR_STRATEGY_POLL_MS:5000}
    # PAPER (default), LIVE, or SIMULATED — passed to OMS/execution via SignalPersistedMessage (OrderIntentProcessor).
    poll-execution-mode: ${STOKR_STRATEGY_POLL_EXECUTION_MODE:PAPER}
    symbols: ${STOKR_STRATEGY_SYMBOLS:NIFTY_FUT,BANKNIFTY_FUT}
    # Skip mean-reversion poll when platform Zerodha tape is not operational (no silent stale scans).
    require-operational-live-path: ${STOKR_STRATEGY_REQUIRE_OPERATIONAL_LIVE_PATH:false}
    pipeline:
      auto-activate: ${STOKR_SIGNAL_PIPELINE_AUTO_ACTIVATE:true}
      default-universe-group: ${STOKR_SIGNAL_PIPELINE_UNIVERSE:NIFTY_50}
      fast-scan-interval-seconds: ${STOKR_SIGNAL_PIPELINE_SCAN_SEC:5}
    session:
      zone: ${STOKR_STRATEGY_SESSION_ZONE:Asia/Kolkata}
      start: ${STOKR_STRATEGY_SESSION_START:09:25}
      end: ${STOKR_STRATEGY_SESSION_END:14:45}
    system-user-id: ${STOKR_STRATEGY_SYSTEM_USER_ID:33333333-3333-3333-3333-333333333333}
    default-quantity: ${STOKR_STRATEGY_DEFAULT_QTY:1}
    # NSE_SPIKE_DETECTION V2.0 - Pure data-driven parameters
    spike:
      min-velocity-pct: ${STOKR_SPIKE_MIN_VELOCITY_PCT:0.40}
      min-volume-multiple: ${STOKR_SPIKE_MIN_VOLUME_MULTIPLE:4.5}
      min-bar-quality-threshold: ${STOKR_SPIKE_MIN_BAR_QUALITY_THRESHOLD:80.0}
      max-wick-pct-before-reject: ${STOKR_SPIKE_MAX_WICK_PCT_BEFORE_REJECT:0.40}
      require-continuation-candle: ${STOKR_SPIKE_REQUIRE_CONTINUATION_CANDLE:true}
      min-composite-score: ${STOKR_SPIKE_MIN_COMPOSITE_SCORE:85.0}
      cooldown-seconds: ${STOKR_SPIKE_COOLDOWN_SECONDS:900}
      # Dynamic stop loss (not fixed ATR multiple)
      sl-offset-pct: ${STOKR_SPIKE_SL_OFFSET_PCT:0.50}
      # Dynamic target (retest-based)
      target-tight-range-extension: ${STOKR_SPIKE_TARGET_TIGHT_RANGE_EXTENSION:0.50}
      target-wide-range-extension: ${STOKR_SPIKE_TARGET_WIDE_RANGE_EXTENSION:1.50}
      range-width-threshold-pct: ${STOKR_SPIKE_RANGE_WIDTH_THRESHOLD_PCT:1.0}
      min-risk-reward: ${STOKR_SPIKE_MIN_RR:1.8}
      regime-min-range-pct: ${STOKR_SPIKE_REGIME_MIN_RANGE_PCT:0.60}
      regime-min-directional-bars: ${STOKR_SPIKE_REGIME_MIN_DIRECTIONAL_BARS:6}
      require-prev-bar-alignment: ${STOKR_SPIKE_REQUIRE_PREV_BAR_ALIGNMENT:true}
    earlybreakout:
      min-range-pct: ${STOKR_EARLYBREAKOUT_MIN_RANGE_PCT:0.15}
      max-range-pct: ${STOKR_EARLYBREAKOUT_MAX_RANGE_PCT:2.0}
      min-volume-multiple: ${STOKR_EARLYBREAKOUT_MIN_VOLUME_MULTIPLE:1.2}
      min-body-ratio: ${STOKR_EARLYBREAKOUT_MIN_BODY_RATIO:0.50}
      breakout-exceed-pct: ${STOKR_EARLYBREAKOUT_BREAKOUT_EXCEED_PCT:0.05}
      cooldown-seconds: ${STOKR_EARLYBREAKOUT_COOLDOWN_SECONDS:600}
      min-risk-reward: ${STOKR_EARLYBREAKOUT_MIN_RR:1.2}
    vwapbounce:
      touch-threshold-pct: ${STOKR_VWAPBOUNCE_TOUCH_THRESHOLD_PCT:0.12}
      min-slope-pct: ${STOKR_VWAPBOUNCE_MIN_SLOPE_PCT:0.002}
      min-volume-multiple: ${STOKR_VWAPBOUNCE_MIN_VOLUME_MULTIPLE:1.0}
      bounce-confirm-pct: ${STOKR_VWAPBOUNCE_BOUNCE_CONFIRM_PCT:0.06}
      cooldown-seconds: ${STOKR_VWAPBOUNCE_COOLDOWN_SECONDS:600}
      min-risk-reward: ${STOKR_VWAPBOUNCE_MIN_RR:1.2}
    daily-cap:
      enabled: ${STOKR_STRATEGY_DAILY_CAP_ENABLED:true}
      default: ${STOKR_STRATEGY_DAILY_CAP_DEFAULT:120}
      per-strategy:
        NSE_SPIKE_DETECTION: ${STOKR_SPIKE_DAILY_CAP:80}
        EARLY_BREAKOUT: ${STOKR_EARLYBREAKOUT_DAILY_CAP:40}
        VWAP_BOUNCE: ${STOKR_VWAPBOUNCE_DAILY_CAP:25}
        GAP_FILL: ${STOKR_GAPFILL_DAILY_CAP:30}
        SECTOR_LAGGARD: ${STOKR_SECTOR_LAGGARD_DAILY_CAP:30}
  simulation:
    candle-timeframe: ${STOKR_SIM_TF:1m}
    latency-ms: ${STOKR_SIM_LATENCY_MS:1500}
    base-slippage-bps: ${STOKR_SIM_SLIPPAGE_BPS:1.0}
    base-spread-bps: ${STOKR_SIM_SPREAD_BPS:1.0}
    partial-fill-count: ${STOKR_SIM_PARTIAL_FILLS:1}
    order-queue-delay-ms: ${STOKR_SIM_QUEUE_DELAY_MS:0}
  execution:
    # Fixed lot size for signal → OMS orders (production traders). Test-lab signals use suggestedQty.
    signal-order-quantity: ${STOKR_SIGNAL_ORDER_QTY:1}
    max-attempts: ${STOKR_EXECUTION_MAX_ATTEMPTS:5}
    live-trading-enabled: ${STOKR_LIVE_TRADING_ENABLED:false}
    broker-fill-sync:
      enabled: ${STOKR_BROKER_FILL_SYNC_ENABLED:true}
      interval-ms: ${STOKR_BROKER_FILL_SYNC_MS:15000}
  reconciliation:
    interval-ms: ${STOKR_RECONCILIATION_INTERVAL_MS:30000}
  signal:
    outcome-track-ms: ${STOKR_SIGNAL_OUTCOME_TRACK_MS:300000}
    outcome-fast-track-ms: ${STOKR_SIGNAL_OUTCOME_FAST_TRACK_MS:30000}
    # Symbol-level cooldown to prevent signal spam (e.g., VWAP was firing 3,937 signals/day)
    # After a signal for SYMBOL+STRATEGY, skip next signals within cooldown window
    # 300s = 5 min per symbol per strategy (reduce noise by ~95% while preserving quality)
    cooldown-seconds: ${STOKR_SIGNAL_COOLDOWN_SECONDS:900}
  runtime:
    live-heartbeat-stale-seconds: ${STOKR_RUNTIME_LIVE_STALE_SECONDS:600}
  crypto:
    field-key: ${STOKR_CRYPTO_FIELD_KEY:}
  telegram:
    bot-token: ${STOKR_TELEGRAM_BOT_TOKEN:}
    bot-username: ${STOKR_TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${STOKR_TELEGRAM_WEBHOOK_SECRET:}
    dry-run: ${STOKR_TELEGRAM_DRY_RUN:true}
  broker:
    zerodha:
      api-key: ${STOKR_ZERODHA_API_KEY:}
      api-secret: ${STOKR_ZERODHA_API_SECRET:}
      # Default is http for local Spring only; Kite Connect rejects non-HTTPS — set STOKR_ZERODHA_REDIRECT_URL to https://... in .env.
      redirect-url: ${STOKR_ZERODHA_REDIRECT_URL:http://localhost:8080/api/broker/zerodha/callback}
      sync-enabled: ${STOKR_ZERODHA_SYNC_ENABLED:true}
      sync-ms: ${STOKR_ZERODHA_SYNC_MS:300000}
      token-refresh-enabled: ${STOKR_ZERODHA_TOKEN_REFRESH_ENABLED:true}
      token-refresh-before-hours: ${STOKR_ZERODHA_TOKEN_REFRESH_BEFORE_HOURS:4}
      token-refresh-interval-ms: ${STOKR_ZERODHA_TOKEN_REFRESH_INTERVAL_MS:1800000}
      token-refresh-daily-cron: ${STOKR_ZERODHA_TOKEN_REFRESH_DAILY_CRON:0 45 5 * * *}
      test-order-enabled: ${STOKR_ZERODHA_TEST_ORDER_ENABLED:false}
      test-order-dry-run: ${STOKR_ZERODHA_TEST_ORDER_DRY_RUN:true}
  ui:
    # Keep localhost default for dev; override in .env on server deployments.
    public-base-url: ${STOKR_UI_PUBLIC_BASE_URL:http://localhost:5173}
  replay:
    # When true, inserts deterministic NIFTY 50 / 1m candles for ~45d ending "now" if the DB has fewer than 5k bars (local/Docker).
    # Disable in production (ingest real market data instead).
    seed-synthetic-candles: ${STOKR_REPLAY_SEED_SYNTHETIC:false}
  platform:
    zerodha:
      # In-process Kite WebSocket for admin platform feed — persists telemetry to platform_broker_feed_sessions and ingests LTP ticks.
      live-feed-enabled: ${STOKR_PLATFORM_ZERODHA_LIVE_FEED_ENABLED:true}
      instrument-tokens: ${STOKR_PLATFORM_ZERODHA_INSTRUMENT_TOKENS:256265}

logging:
  level:
    root: INFO
    com.stokr: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
