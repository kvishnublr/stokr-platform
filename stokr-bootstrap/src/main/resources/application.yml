server:
  port: 8080
  # Detect HTTPS behind reverse proxy (nginx sends X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-For).
  # This is required for Zerodha OAuth to work behind HTTPS reverse proxy.
  forward-headers-strategy: framework
  tomcat:
    # Tuned for t2/t3.micro. Raise threads.max to 100 on t3.medium+.
    threads:
      max: ${TOMCAT_MAX_THREADS:30}
      min-spare: ${TOMCAT_MIN_THREADS:5}
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  application:
    name: stokr-platform
  jackson:
    time-zone: Asia/Kolkata
  mail:
    # spring.mail.host is intentionally omitted here so an unset host does not create a broken JavaMailSender.
    # Use SPRING_MAIL_HOST / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD in repo-root .env (see .env.example),
    # or dotted spring.mail.* in .env. When only SPRING_MAIL_HOST is set, StokrJavaMailSenderFallbackConfiguration
    # supplies JavaMailSender if Boot mail auto-config does not.
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
  # Load repo-root .env in IntelliJ / CLI without hand-copying env vars (KEY=value = Java properties).
  # CWD is often repo root or stokr-bootstrap — both paths are tried, optional if missing.
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stokr_platform}
    # Defaults match .env.example. Docker Compose sets DB_USER/DB_PASSWORD for the api service.
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      # Raise HIKARI_MAX_POOL_SIZE on production (catalog scan + execution). Default 20.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 60000
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:60000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    validate-on-migrate: false
    enabled: true
    out-of-order: ${STOKR_FLYWAY_OUT_OF_ORDER:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Set false in .env when RabbitMQ is not running locally (API + login without full stack).
        auto-startup: ${STOKR_RABBIT_LISTENERS_ENABLED:true}
      direct:
        auto-startup: ${STOKR_RABBIT_LISTENERS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      # Off by default: without RabbitMQ, actuator health was opening TCP to :5672 and logging a full stack trace.
      # Set true in .env / Docker when brokers and AMQP are part of your deployment.
      enabled: ${STOKR_RABBIT_HEALTH_ENABLED:false}
    mail:
      # Off by default: partial SMTP config (e.g. host set, no password) makes MailHealthIndicator fail and spam WARNs.
      # Set STOKR_MAIL_HEALTH_ENABLED=true when SMTP is fully reachable (production, Mailtrap, or local Mailpit with matching auth).
      # Mailpit: use SPRING_MAIL_SMTP_AUTH=false and SPRING_MAIL_SMTP_STARTTLS=false; From address still requires SPRING_MAIL_USERNAME.
      enabled: ${STOKR_MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

stokr:
  deploy:
    git-commit: ${STOKR_GIT_COMMIT:unknown}
    branch: ${STOKR_DEPLOY_BRANCH:Release_v1}
  marketdata:
    integrity:
      enabled: ${STOKR_MARKETDATA_INTEGRITY_ENABLED:true}
      equity-candle-max-age-seconds: ${STOKR_MARKETDATA_INTEGRITY_EQUITY_CANDLE_MAX_AGE_SEC:300}
      index-candle-max-age-seconds: ${STOKR_MARKETDATA_INTEGRITY_INDEX_CANDLE_MAX_AGE_SEC:300}
      tick-max-age-seconds: ${STOKR_MARKETDATA_INTEGRITY_TICK_MAX_AGE_SEC:90}
      use-live-tick-proxy-for-candle-freshness: ${STOKR_MARKETDATA_INTEGRITY_USE_LIVE_TICK_PROXY:true}
      rejection-dedupe-seconds: ${STOKR_MARKETDATA_INTEGRITY_REJECTION_DEDUPE_SEC:300}
      mid-session-recovery:
        enabled: ${STOKR_MARKETDATA_INTEGRITY_MID_SESSION_RECOVERY:true}
      mid-session-min-bars: ${STOKR_INTEGRITY_MID_SESSION_MIN_BARS:20}
    session:
      nse:
        start: ${STOKR_MARKETDATA_NSE_SESSION_START:09:15}
        end: ${STOKR_MARKETDATA_NSE_SESSION_END:15:30}
      mcx:
        start: ${STOKR_MARKETDATA_MCX_SESSION_START:09:00}
        end: ${STOKR_MARKETDATA_MCX_SESSION_END:23:30}
      cds:
        start: ${STOKR_MARKETDATA_CDS_SESSION_START:09:00}
        end: ${STOKR_MARKETDATA_CDS_SESSION_END:17:00}
    feed-health:
      poll-ms: ${STOKR_FEED_HEALTH_POLL_MS:${STOKR_MARKETDATA_FEED_HEALTH_POLL_MS:30000}}
      equity-stale-seconds: ${STOKR_FEED_HEALTH_EQUITY_STALE_SEC:${STOKR_MARKETDATA_FEED_HEALTH_EQUITY_STALE_SECONDS:120}}
      index-stale-seconds: ${STOKR_FEED_HEALTH_INDEX_STALE_SEC:${STOKR_MARKETDATA_FEED_HEALTH_INDEX_STALE_SECONDS:120}}
      tick-stale-seconds: ${STOKR_FEED_HEALTH_TICK_STALE_SEC:${STOKR_MARKETDATA_FEED_HEALTH_TICK_STALE_SECONDS:60}}
      outage-error-seconds: ${STOKR_FEED_HEALTH_OUTAGE_ERROR_SEC:${STOKR_MARKETDATA_FEED_HEALTH_OUTAGE_ERROR_SECONDS:900}}
      session-warmup-seconds: ${STOKR_FEED_HEALTH_SESSION_WARMUP_SEC:180}
  broker-truth:
    poll-ms: ${STOKR_BROKER_TRUTH_POLL_MS:3000}
    stale-ms: ${STOKR_BROKER_TRUTH_STALE_MS:15000}
  rabbit:
    # Gates @RabbitListener registration (see stokr-execution messaging). Same env as spring.rabbitmq.listener.*.auto-startup.
    # false = no AMQP consumer reconnect loop when RabbitMQ is down (typical local IntelliJ + DB only).
    listeners-enabled: ${STOKR_RABBIT_LISTENERS_ENABLED:true}
  adv-dashboard:
    universe-group: ${STOKR_ADV_UNIVERSE_GROUP:NIFTY_50}
    max-symbols: ${STOKR_ADV_MAX_SYMBOLS:50}
    feed-interval-ms: ${STOKR_ADV_FEED_INTERVAL_MS:45000}
  admin:
    ops:
      sse-tick-ms: ${STOKR_ADMIN_OPS_SSE_TICK_MS:15000}
      snapshot-cache-ms: ${STOKR_ADMIN_OPS_SNAPSHOT_CACHE_MS:4000}
      snapshot-stale-max-ms: ${STOKR_ADMIN_OPS_SNAPSHOT_STALE_MAX_MS:120000}
      snapshot-warm-ms: ${STOKR_ADMIN_OPS_SNAPSHOT_WARM_MS:10000}
  # Single env: STOKR_CORS_ALLOWED_ORIGINS (comma-separated). Edit repo-root .env only — local + Docker + IntelliJ all load it.
  cors:
    allowed-origins: ${STOKR_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
  auth:
    login:
      max-failed-attempts: ${STOKR_AUTH_MAX_FAILED:5}
      lock-duration-minutes: ${STOKR_AUTH_LOCK_MINUTES:15}
      password-reset-hours-valid: ${STOKR_AUTH_PW_RESET_HOURS:1}
    # When spring.mail.host is unset, verification URL is logged at WARN for local dev (override if UI runs on another port).
    email-verification-base-url: ${STOKR_EMAIL_VERIFY_BASE_URL:http://localhost:5173}
    # Minimum seconds between authenticated resend-verification requests (same user). 0 = disabled (local dev).
    verification-resend-cooldown-seconds: ${STOKR_AUTH_VERIFY_RESEND_COOLDOWN:0}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-use-long-random-secret-for-development-only}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  risk:
    zone: ${STOKR_RISK_ZONE:Asia/Kolkata}
    max-order-qty: ${STOKR_RISK_MAX_ORDER_QTY:100000}
    max-order-notional: ${STOKR_RISK_MAX_ORDER_NOTIONAL:50000000}
    max-open-positions: ${STOKR_RISK_MAX_OPEN_POSITIONS:100}
    order-cooldown-ms: ${STOKR_RISK_ORDER_COOLDOWN_MS:0}
    max-trades-per-day: ${STOKR_RISK_MAX_TRADES_PER_DAY:200}
    max-daily-loss-amount: ${STOKR_RISK_MAX_DAILY_LOSS_AMOUNT:0}
    max-portfolio-drawdown-pct: ${STOKR_RISK_MAX_PORTFOLIO_DRAWDOWN_PCT:0}
    max-strategy-notional: ${STOKR_RISK_MAX_STRATEGY_NOTIONAL:0}
    max-orders-per-minute: ${STOKR_RISK_MAX_ORDERS_PER_MINUTE:0}
    volatility-halt-atr-close-ratio: ${STOKR_RISK_VOLATILITY_HALT_ATR_CLOSE_RATIO:0}
    trading-window-start: ${STOKR_RISK_TRADING_WINDOW_START:09:25}
    trading-window-end: ${STOKR_RISK_TRADING_WINDOW_END:14:45}
    trading-window-mcx-start: ${STOKR_RISK_TRADING_WINDOW_MCX_START:09:00}
    trading-window-mcx-end: ${STOKR_RISK_TRADING_WINDOW_MCX_END:23:55}
  catalog:
    scan:
      enabled: ${STOKR_CATALOG_SCAN_ENABLED:true}
      poll-ms: ${STOKR_CATALOG_SCAN_POLL_MS:15000}
    # How long resolved bindings + universe symbols are cached in memory before re-fetching from DB.
    # Default 5 min: a 60s scan cycle costs 0 DB queries for binding resolution.
    universe-cache-seconds: ${STOKR_CATALOG_UNIVERSE_CACHE_SECONDS:300}
  backfill:
    # Disabled by default — backfill hammers DB with 1000s of queries across all symbols.
    # Enable explicitly on a healthy instance: STOKR_BACKFILL_ENABLED=true
    enabled: ${STOKR_BACKFILL_ENABLED:false}
    # Keep lookback short to avoid hours-long runs on t2/t3.micro
    lookback-days: ${STOKR_BACKFILL_LOOKBACK_DAYS:30}
  strategy:
    # Per-strategy execution mode: LIVE, PAPER, DRY_RUN, DISABLED
    execution-modes:
      allow-live: ${STOKR_EXECUTION_MODES_ALLOW_LIVE:true}
      live-validated: ${STOKR_EXECUTION_MODES_LIVE_VALIDATED:GAP_FILL,NSE_SPIKE_DETECTION,VWAP_BOUNCE,SECTOR_LAGGARD,ADV_CASH,INDEX_HUNT}
      GAP_FILL: ${STOKR_EXEC_MODE_GAP_FILL:LIVE}
      SECTOR_LAGGARD: ${STOKR_EXEC_MODE_SECTOR_LAGGARD:LIVE}
      NSE_SPIKE_DETECTION: ${STOKR_EXEC_MODE_NSE_SPIKE:LIVE}
      EARLY_BREAKOUT: ${STOKR_EXEC_MODE_EARLY_BREAKOUT:PAPER}
      VWAP_BOUNCE: ${STOKR_EXEC_MODE_VWAP_BOUNCE:LIVE}
      INDEX_HUNT: ${STOKR_EXEC_MODE_INDEX_HUNT:BOTH}
      ADV_CASH: ${STOKR_EXEC_MODE_ADV_CASH:LIVE}
      S3_VWAP_RETEST: ${STOKR_EXEC_MODE_S3:PAPER}
      S7_RANGE_FADE: ${STOKR_EXEC_MODE_S7:PAPER}
      PRE_OPEN_GAP_OI: ${STOKR_EXEC_MODE_PRE_OPEN_GAP_OI:LIVE}
      COMMODITIES_E2E_TEST: ${STOKR_EXEC_MODE_COMMODITIES_E2E_TEST:PAPER}
      USDINR_MOMENTUM: ${STOKR_EXEC_MODE_USDINR_MOMENTUM:PAPER}
      EURINR_MEAN_REVERSION: ${STOKR_EXEC_MODE_EURINR_MEAN_REVERSION:PAPER}
    commodities-e2e-test:
      enabled: ${STOKR_COMMODITIES_E2E_TEST_ENABLED:true}
      scan-fire: ${STOKR_COMMODITIES_E2E_TEST_SCAN_FIRE:false}
      max-candle-age-seconds: ${STOKR_COMMODITIES_E2E_TEST_MAX_CANDLE_AGE_SEC:180}
    safe-startup:
      enabled: ${STOKR_SAFE_STARTUP_ENABLED:true}
      min-warmup-seconds: ${STOKR_SAFE_STARTUP_WARMUP_SEC:120}
    gate-telemetry:
      enabled: ${STOKR_STRATEGY_GATE_TELEMETRY_ENABLED:false}
      min-interval-seconds: ${STOKR_STRATEGY_GATE_TELEMETRY_INTERVAL_SEC:60}
    session-summary:
      cron: ${STOKR_SESSION_SUMMARY_CRON:0 35 15 * * MON-FRI}
    lifecycle:
      emergency:
        spread-pct: ${STOKR_LIFECYCLE_EMERGENCY_SPREAD_PCT:0.50}
        bar-range-pct: ${STOKR_LIFECYCLE_EMERGENCY_BAR_RANGE_PCT:2.5}
        candle-stale-seconds: ${STOKR_LIFECYCLE_EMERGENCY_CANDLE_STALE_SEC:120}
        volume-vacuum-ratio: ${STOKR_LIFECYCLE_EMERGENCY_VOLUME_VACUUM:0.10}
        min-hold-seconds: ${STOKR_LIFECYCLE_EMERGENCY_MIN_HOLD_SEC:180}
    smart-exit:
      enabled: ${STOKR_SMART_EXIT_ENABLED:true}
      interval-ms: ${STOKR_SMART_EXIT_INTERVAL_MS:15000}
      pressure-reversal-buy: ${STOKR_SMART_EXIT_PRESSURE_REVERSAL_BUY:0.43}
      pressure-reversal-sell: ${STOKR_SMART_EXIT_PRESSURE_REVERSAL_SELL:0.57}
      exhaustion-consistency: ${STOKR_SMART_EXIT_EXHAUSTION_CONSISTENCY:0.35}
      pressure-lookback: ${STOKR_SMART_EXIT_PRESSURE_LOOKBACK:60}
      trailing-mfe-ratio: ${STOKR_SMART_EXIT_TRAILING_MFE_RATIO:0.40}
      min-progress-pct: ${STOKR_SMART_EXIT_MIN_PROGRESS_PCT:20}
      counter-candle-body-ratio: ${STOKR_SMART_EXIT_COUNTER_CANDLE_BODY_RATIO:0.55}
    # Drop new signals when reference price exceeds ceiling (INR). 0 or negative = disabled.
    max-entry-price: ${STOKR_STRATEGY_MAX_ENTRY_PRICE:5000}
    quality-gate:
      enabled: ${STOKR_STRATEGY_QUALITY_GATE_ENABLED:true}
      min-confidence: ${STOKR_STRATEGY_MIN_CONFIDENCE:0.55}
      min-risk-reward: ${STOKR_STRATEGY_MIN_RR:1.2}
    signal:
      quality:
        # Institutional-grade signal quality gates
        min-rr: ${STOKR_SIGNAL_QUALITY_MIN_RR:1.5}
        min-candle-body-pct: ${STOKR_SIGNAL_QUALITY_MIN_CANDLE_BODY_PCT:0.003}
        max-atr-compression-pct: ${STOKR_SIGNAL_QUALITY_MAX_ATR_COMPRESSION_PCT:0.005}
        max-atr-expansion-pct: ${STOKR_SIGNAL_QUALITY_MAX_ATR_EXPANSION_PCT:0.03}
        stale-candle-seconds: ${STOKR_SIGNAL_QUALITY_STALE_CANDLE_SECONDS:60}
        min-volume-ratio: ${STOKR_SIGNAL_QUALITY_MIN_VOLUME_RATIO:0.8}
        max-concurrent-trades: ${STOKR_SIGNAL_QUALITY_MAX_CONCURRENT_TRADES:10}
      cooldown-seconds: ${STOKR_SIGNAL_COOLDOWN_SECONDS:900}
    signal-dedup:
      cooldown-minutes: ${STOKR_STRATEGY_SIGNAL_DEDUP_MINUTES:15}
    exit:
      breakeven-enabled: ${STOKR_STRATEGY_BREAKEVEN_EXIT_ENABLED:true}
      breakeven-mfe-ratio: ${STOKR_STRATEGY_BREAKEVEN_MFE_RATIO:0.5}
      auto-exit-enabled: ${STOKR_STRATEGY_AUTO_EXIT_ENABLED:true}
      auto-exit-on-breakeven: ${STOKR_STRATEGY_AUTO_EXIT_BREAKEVEN:true}
    replay:
      dispatch-to-oms: ${STOKR_STRATEGY_REPLAY_DISPATCH_OMS:false}
    subscription-default-symbol: ${STOKR_STRATEGY_SUBSCRIPTION_SYMBOL:NIFTY_FUT}
    mean-reversion:
      enabled: ${STOKR_STRATEGY_MR_ENABLED:true}
    poll-ms: ${STOKR_STRATEGY_POLL_MS:5000}
    # PAPER (default), LIVE, or SIMULATED — passed to OMS/execution via SignalPersistedMessage (OrderIntentProcessor).
    poll-execution-mode: ${STOKR_STRATEGY_POLL_EXECUTION_MODE:PAPER}
    symbols: ${STOKR_STRATEGY_SYMBOLS:NIFTY_FUT,BANKNIFTY_FUT}
    # Skip mean-reversion poll when platform Zerodha tape is not operational (no silent stale scans).
    require-operational-live-path: ${STOKR_STRATEGY_REQUIRE_OPERATIONAL_LIVE_PATH:false}
    pipeline:
      auto-activate: ${STOKR_SIGNAL_PIPELINE_AUTO_ACTIVATE:true}
      default-universe-group: ${STOKR_SIGNAL_PIPELINE_UNIVERSE:NIFTY_50}
      fast-scan-interval-seconds: ${STOKR_SIGNAL_PIPELINE_SCAN_SEC:5}
    session:
      zone: ${STOKR_STRATEGY_SESSION_ZONE:Asia/Kolkata}
      start: ${STOKR_STRATEGY_SESSION_START:09:25}
      end: ${STOKR_STRATEGY_SESSION_END:14:45}
    system-user-id: ${STOKR_STRATEGY_SYSTEM_USER_ID:33333333-3333-3333-3333-333333333333}
    primary-trader-user-id: ${STOKR_PRIMARY_TRADER_USER_ID:6343e483-1d21-4fdf-ac0c-1ba19eaf2ff4}
    default-quantity: ${STOKR_STRATEGY_DEFAULT_QTY:1}
    # NSE_SPIKE_DETECTION V2.0 - Pure data-driven parameters
    spike:
      min-velocity-pct: ${STOKR_SPIKE_MIN_VELOCITY_PCT:0.40}
      min-volume-multiple: ${STOKR_SPIKE_MIN_VOLUME_MULTIPLE:4.5}
      min-bar-quality-threshold: ${STOKR_SPIKE_MIN_BAR_QUALITY_THRESHOLD:80.0}
      max-wick-pct-before-reject: ${STOKR_SPIKE_MAX_WICK_PCT_BEFORE_REJECT:0.40}
      require-continuation-candle: ${STOKR_SPIKE_REQUIRE_CONTINUATION_CANDLE:true}
      min-composite-score: ${STOKR_SPIKE_MIN_COMPOSITE_SCORE:85.0}
      cooldown-seconds: ${STOKR_SPIKE_COOLDOWN_SECONDS:900}
      # Dynamic stop loss (not fixed ATR multiple)
      sl-offset-pct: ${STOKR_SPIKE_SL_OFFSET_PCT:0.50}
      # Dynamic target (retest-based)
      target-tight-range-extension: ${STOKR_SPIKE_TARGET_TIGHT_RANGE_EXTENSION:0.50}
      target-wide-range-extension: ${STOKR_SPIKE_TARGET_WIDE_RANGE_EXTENSION:1.50}
      range-width-threshold-pct: ${STOKR_SPIKE_RANGE_WIDTH_THRESHOLD_PCT:1.0}
      min-risk-reward: ${STOKR_SPIKE_MIN_RR:1.8}
      regime-min-range-pct: ${STOKR_SPIKE_REGIME_MIN_RANGE_PCT:0.60}
      regime-min-directional-bars: ${STOKR_SPIKE_REGIME_MIN_DIRECTIONAL_BARS:6}
      require-prev-bar-alignment: ${STOKR_SPIKE_REQUIRE_PREV_BAR_ALIGNMENT:true}
    earlybreakout:
      min-range-pct: ${STOKR_EARLYBREAKOUT_MIN_RANGE_PCT:0.15}
      max-range-pct: ${STOKR_EARLYBREAKOUT_MAX_RANGE_PCT:2.0}
      min-volume-multiple: ${STOKR_EARLYBREAKOUT_MIN_VOLUME_MULTIPLE:1.2}
      min-body-ratio: ${STOKR_EARLYBREAKOUT_MIN_BODY_RATIO:0.50}
      breakout-exceed-pct: ${STOKR_EARLYBREAKOUT_BREAKOUT_EXCEED_PCT:0.05}
      cooldown-seconds: ${STOKR_EARLYBREAKOUT_COOLDOWN_SECONDS:600}
      min-risk-reward: ${STOKR_EARLYBREAKOUT_MIN_RR:1.2}
    vwapbounce:
      touch-threshold-pct: ${STOKR_VWAPBOUNCE_TOUCH_THRESHOLD_PCT:0.12}
      min-slope-pct: ${STOKR_VWAPBOUNCE_MIN_SLOPE_PCT:0.002}
      min-volume-multiple: ${STOKR_VWAPBOUNCE_MIN_VOLUME_MULTIPLE:1.0}
      bounce-confirm-pct: ${STOKR_VWAPBOUNCE_BOUNCE_CONFIRM_PCT:0.06}
      cooldown-seconds: ${STOKR_VWAPBOUNCE_COOLDOWN_SECONDS:600}
      min-risk-reward: ${STOKR_VWAPBOUNCE_MIN_RR:1.2}
    daily-cap:
      enabled: ${STOKR_STRATEGY_DAILY_CAP_ENABLED:true}
      default: ${STOKR_STRATEGY_DAILY_CAP_DEFAULT:120}
      per-strategy:
        NSE_SPIKE_DETECTION: ${STOKR_SPIKE_DAILY_CAP:80}
        EARLY_BREAKOUT: ${STOKR_EARLYBREAKOUT_DAILY_CAP:40}
        VWAP_BOUNCE: ${STOKR_VWAPBOUNCE_DAILY_CAP:25}
        GAP_FILL: ${STOKR_GAPFILL_DAILY_CAP:30}
        SECTOR_LAGGARD: ${STOKR_SECTOR_LAGGARD_DAILY_CAP:30}
    market-close:
      nse-exit-cron: ${STOKR_STRATEGY_MARKET_CLOSE_NSE_EXIT_CRON:0 55 14 * * MON-FRI}
      mcx-exit-cron: ${STOKR_STRATEGY_MARKET_CLOSE_MCX_EXIT_CRON:0 45 23 * * MON-FRI}
    broker-disconnect:
      block-live: ${STOKR_OMS_BROKER_DISCONNECT_BLOCK:true}
      auto-heal-before-block: ${STOKR_OMS_BROKER_AUTO_HEAL_BEFORE_BLOCK:true}
      flatten-on-disconnect: ${STOKR_OMS_BROKER_DISCONNECT_FLATTEN:false}
      halt-ttl-hours: ${STOKR_OMS_BROKER_HALT_TTL_HOURS:4}
    live-rollout:
      default-live-qty: ${STOKR_OMS_LIVE_DEFAULT_QTY:1}
  simulation:
    candle-timeframe: ${STOKR_SIM_TF:1m}
    latency-ms: ${STOKR_SIM_LATENCY_MS:1500}
    base-slippage-bps: ${STOKR_SIM_SLIPPAGE_BPS:1.0}
    base-spread-bps: ${STOKR_SIM_SPREAD_BPS:1.0}
    partial-fill-count: ${STOKR_SIM_PARTIAL_FILLS:1}
    order-queue-delay-ms: ${STOKR_SIM_QUEUE_DELAY_MS:0}
  execution:
    # Fixed lot size for signal → OMS orders (production traders). Test-lab signals use suggestedQty.
    signal-order-quantity: ${STOKR_SIGNAL_ORDER_QTY:1}
    max-attempts: ${STOKR_EXECUTION_MAX_ATTEMPTS:5}
    live-trading-enabled: ${STOKR_LIVE_TRADING_ENABLED:false}
    broker-fill-sync:
      enabled: ${STOKR_BROKER_FILL_SYNC_ENABLED:true}
      interval-ms: ${STOKR_BROKER_FILL_SYNC_MS:15000}
    target-profit:
      enabled: ${STOKR_TARGET_PROFIT_MONITORING_ENABLED:true}
      percent: ${STOKR_TARGET_PROFIT_PERCENT:0.45}
      monitor-interval-ms: ${STOKR_TARGET_PROFIT_MONITOR_INTERVAL_MS:15000}
    stop-loss:
      enabled: ${STOKR_STOP_LOSS_MONITORING_ENABLED:true}
      percent: ${STOKR_STOP_LOSS_PERCENT:0.25}
  oms:
    kill-switch:
      config-enabled: ${STOKR_OMS_KILL_SWITCH_CONFIG:false}
      flatten-on-activate: ${STOKR_OMS_KILL_SWITCH_FLATTEN:false}
    dedupe:
      window-seconds: ${STOKR_OMS_DEDUPE_WINDOW_SEC:300}
    exposure:
      max-daily-loss: ${STOKR_OMS_MAX_DAILY_LOSS:50000}
      max-loss-per-strategy: ${STOKR_OMS_MAX_STRATEGY_LOSS:20000}
      max-concurrent-positions: ${STOKR_OMS_MAX_CONCURRENT_POSITIONS:10}
      max-exposure-per-symbol: ${STOKR_OMS_MAX_EXPOSURE_SYMBOL:100000}
      max-exposure-per-strategy: ${STOKR_OMS_MAX_EXPOSURE_STRATEGY:150000}
      max-total-capital-deployed: ${STOKR_OMS_MAX_TOTAL_CAPITAL:500000}
      max-orders-per-minute: ${STOKR_OMS_MAX_ORDERS_PER_MIN:20}
      activate-kill-switch-on-breach: ${STOKR_OMS_KILL_ON_BREACH:false}
    stale-signal:
      scalp-max-seconds: ${STOKR_OMS_STALE_SCALP_SEC:30}
      momentum-max-seconds: ${STOKR_OMS_STALE_MOMENTUM_SEC:120}
      default-max-seconds: ${STOKR_OMS_STALE_DEFAULT_SEC:60}
    market-close:
      no-new-entries-after: ${STOKR_OMS_NO_NEW_ENTRIES_AFTER:15:00}
      flatten-time: ${STOKR_OMS_FLATTEN_TIME:15:20}
      flatten-end: ${STOKR_OMS_FLATTEN_END:15:30}
      flatten-cron: ${STOKR_OMS_FLATTEN_CRON:0 20 15 * * MON-FRI}
      mcx-no-new-entries-after: ${STOKR_OMS_MCX_NO_NEW_ENTRIES_AFTER:23:55}
      mcx-flatten-time: ${STOKR_OMS_MCX_FLATTEN_TIME:23:50}
      mcx-flatten-end: ${STOKR_OMS_MCX_FLATTEN_END:23:55}
      mcx-flatten-cron: ${STOKR_OMS_MCX_FLATTEN_CRON:0 50 23 * * MON-FRI}
      force-close-stale-positions: ${STOKR_OMS_FORCE_CLOSE_STALE:true}
  reconciliation:
    interval-ms: ${STOKR_RECONCILIATION_INTERVAL_MS:30000}
  signal:
    outcome-track-ms: ${STOKR_SIGNAL_OUTCOME_TRACK_MS:300000}
    outcome-fast-track-ms: ${STOKR_SIGNAL_OUTCOME_FAST_TRACK_MS:30000}
    # Symbol-level cooldown to prevent signal spam (e.g., VWAP was firing 3,937 signals/day)
    # After a signal for SYMBOL+STRATEGY, skip next signals within cooldown window
    # 300s = 5 min per symbol per strategy (reduce noise by ~95% while preserving quality)
    cooldown-seconds: ${STOKR_SIGNAL_COOLDOWN_SECONDS:900}
  runtime:
    live-heartbeat-stale-seconds: ${STOKR_RUNTIME_LIVE_STALE_SECONDS:600}
  crypto:
    field-key: ${STOKR_CRYPTO_FIELD_KEY:}
  telegram:
    bot-token: ${STOKR_TELEGRAM_BOT_TOKEN:}
    bot-username: ${STOKR_TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${STOKR_TELEGRAM_WEBHOOK_SECRET:}
    dry-run: ${STOKR_TELEGRAM_DRY_RUN:true}
  broker:
    zerodha:
      api-key: ${STOKR_ZERODHA_API_KEY:}
      api-secret: ${STOKR_ZERODHA_API_SECRET:}
      # Default is http for local Spring only; Kite Connect rejects non-HTTPS — set STOKR_ZERODHA_REDIRECT_URL to https://... in .env.
      redirect-url: ${STOKR_ZERODHA_REDIRECT_URL:http://localhost:8080/api/broker/zerodha/callback}
      sync-enabled: ${STOKR_ZERODHA_SYNC_ENABLED:true}
      sync-ms: ${STOKR_ZERODHA_SYNC_MS:300000}
      token-refresh-enabled: ${STOKR_ZERODHA_TOKEN_REFRESH_ENABLED:true}
      token-refresh-before-hours: ${STOKR_ZERODHA_TOKEN_REFRESH_BEFORE_HOURS:4}
      token-refresh-interval-ms: ${STOKR_ZERODHA_TOKEN_REFRESH_INTERVAL_MS:1800000}
      token-refresh-daily-cron: ${STOKR_ZERODHA_TOKEN_REFRESH_DAILY_CRON:0 45 5 * * *}
      test-order-enabled: ${STOKR_ZERODHA_TEST_ORDER_ENABLED:false}
      test-order-dry-run: ${STOKR_ZERODHA_TEST_ORDER_DRY_RUN:true}
  ui:
    # Keep localhost default for dev; override in .env on server deployments.
    public-base-url: ${STOKR_UI_PUBLIC_BASE_URL:http://localhost:5173}
  replay:
    # When true, inserts deterministic NIFTY 50 / 1m candles for ~45d ending "now" if the DB has fewer than 5k bars (local/Docker).
    # Disable in production (ingest real market data instead).
    seed-synthetic-candles: ${STOKR_REPLAY_SEED_SYNTHETIC:false}
  platform:
    auto-heal:
      # Legacy keys — ranked recovery reads stokr.platform.recovery.* (below).
      enabled: ${STOKR_PLATFORM_AUTO_HEAL_ENABLED:true}
      interval-ms: ${STOKR_PLATFORM_AUTO_HEAL_INTERVAL_MS:45000}
      reconnect-cooldown-sec: ${STOKR_PLATFORM_AUTO_HEAL_RECONNECT_COOLDOWN_SEC:30}
      pipeline-cooldown-sec: ${STOKR_PLATFORM_AUTO_HEAL_PIPELINE_COOLDOWN_SEC:300}
    recovery:
      enabled: ${STOKR_PLATFORM_RECOVERY_ENABLED:${STOKR_PLATFORM_AUTO_HEAL_ENABLED:true}}
      interval-ms: ${STOKR_PLATFORM_RECOVERY_INTERVAL_MS:${STOKR_PLATFORM_AUTO_HEAL_INTERVAL_MS:45000}}
      recheck-wait-ms: ${STOKR_PLATFORM_RECOVERY_RECHECK_WAIT_MS:15000}
      recheck-wait-max-ms: ${STOKR_PLATFORM_RECOVERY_RECHECK_WAIT_MAX_MS:30000}
      service-key: ${STOKR_PLATFORM_RECOVERY_SERVICE_KEY:platform-api}
      max-attempts-per-signature: ${STOKR_PLATFORM_RECOVERY_MAX_ATTEMPTS:3}
      action-cooldown-sec: ${STOKR_PLATFORM_RECOVERY_ACTION_COOLDOWN_SEC:60}
      reconnect-cooldown-sec: ${STOKR_PLATFORM_RECOVERY_RECONNECT_COOLDOWN_SEC:${STOKR_PLATFORM_AUTO_HEAL_RECONNECT_COOLDOWN_SEC:30}}
      pipeline-cooldown-sec: ${STOKR_PLATFORM_RECOVERY_PIPELINE_COOLDOWN_SEC:${STOKR_PLATFORM_AUTO_HEAL_PIPELINE_COOLDOWN_SEC:300}}
      webhook-url: ${STOKR_PLATFORM_RECOVERY_WEBHOOK_URL:}
      escalate-after-attempts: ${STOKR_PLATFORM_RECOVERY_ESCALATE_AFTER:5}
      container-restart-flag-key: ${STOKR_PLATFORM_RECOVERY_RESTART_FLAG_KEY:stokr:platform:recovery:restart-requested}
      scanner-stale-seconds: ${STOKR_PLATFORM_RECOVERY_SCANNER_STALE_SEC:120}
      broker-vendor: ${STOKR_PLATFORM_RECOVERY_BROKER_VENDOR:ZERODHA}
      kill-switch-auto-disarm-sources:
        - BROKER_DISCONNECT
        - RISK_BREACH
    zerodha:
      # In-process Kite WebSocket for admin platform feed — persists telemetry to platform_broker_feed_sessions and ingests LTP ticks.
      live-feed-enabled: ${STOKR_PLATFORM_ZERODHA_LIVE_FEED_ENABLED:true}
      auto-subscribe-cds: ${STOKR_PLATFORM_ZERODHA_AUTO_SUBSCRIBE_CDS:true}
      instrument-tokens: ${STOKR_PLATFORM_ZERODHA_INSTRUMENT_TOKENS:256265}
      pinned-universe-group-keys: ${STOKR_PLATFORM_ZERODHA_PINNED_GROUPS:NIFTY_50,NIFTY_100,CDS_MAJOR_PAIRS}
  cds-backfill:
    enabled: ${STOKR_CDS_BACKFILL_ENABLED:true}
    lookback-days: ${STOKR_CDS_BACKFILL_LOOKBACK_DAYS:10}
  intraday-gap-fill:
    enabled: ${STOKR_INTRADAY_GAP_FILL_ENABLED:true}
    initial-delay-ms: ${STOKR_INTRADAY_GAP_FILL_INITIAL_DELAY_MS:120000}
    poll-ms: ${STOKR_INTRADAY_GAP_FILL_POLL_MS:120000}
    min-interval-seconds: ${STOKR_INTRADAY_GAP_FILL_MIN_INTERVAL_SECONDS:180}
    universe:
      enabled: ${STOKR_INTRADAY_GAP_FILL_UNIVERSE_ENABLED:true}
      max-symbols-per-run: ${STOKR_INTRADAY_GAP_FILL_UNIVERSE_MAX_SYMBOLS:30}

  simulation-mode:
    enabled: false
    bypass-session-guard: true
    bypass-integrity-guard: true
    bypass-safe-startup: true
    simulate-broker-execution: true
    broker-vendor: SIMULATED
    default-execution-mode: PAPER
    system-user-id: "33333333-3333-3333-3333-333333333333"

  # ============= PHASE 1: ORDER FLOW ANALYSIS =============
  orderflow:
    # Main feature flag - starts DISABLED
    collection-enabled: ${STOKR_ORDERFLOW_COLLECTION_ENABLED:false}

    # When enabled, adjust quality scores based on order flow
    enhancement-enabled: ${STOKR_ORDERFLOW_ENHANCEMENT_ENABLED:false}

    # How much to weight order flow confidence (0.0 = ignore, 1.0 = full weight)
    confidence-adjustment-factor: ${STOKR_ORDERFLOW_CONFIDENCE_ADJUSTMENT:0.5}

    # Data source configuration
    datasource:
      type: ${STOKR_ORDERFLOW_DATASOURCE_TYPE:NSE_FEED}  # NSE_FEED, SIMULATED
      poll-interval-ms: ${STOKR_ORDERFLOW_POLL_INTERVAL_MS:100}  # 10x per second
      buffer-size: ${STOKR_ORDERFLOW_BUFFER_SIZE:1000}

    # Redis caching for real-time access
    redis-cache-enabled: ${STOKR_ORDERFLOW_REDIS_ENABLED:true}
    redis-cache-ttl-seconds: ${STOKR_ORDERFLOW_REDIS_TTL:2}

    # Feature flags for individual metrics
    metrics:
      buyerpressure-enabled: ${STOKR_ORDERFLOW_BUYER_PRESSURE_ENABLED:true}
      spread-analysis-enabled: ${STOKR_ORDERFLOW_SPREAD_ANALYSIS_ENABLED:true}
      liquidity-analysis-enabled: ${STOKR_ORDERFLOW_LIQUIDITY_ANALYSIS_ENABLED:true}
      depth-analysis-enabled: ${STOKR_ORDERFLOW_DEPTH_ANALYSIS_ENABLED:true}

    # Thresholds for signal recommendations
    thresholds:
      min-buyer-pressure-for-buy: ${STOKR_ORDERFLOW_MIN_BUYER_PRESSURE:55}
      min-seller-pressure-for-sell: ${STOKR_ORDERFLOW_MIN_SELLER_PRESSURE:55}
      min-liquidity-for-trade: ${STOKR_ORDERFLOW_MIN_LIQUIDITY:50}
      max-spread-pct-for-trade: ${STOKR_ORDERFLOW_MAX_SPREAD_PCT:0.3}

    # Database retention
    retention:
      keep-days: ${STOKR_ORDERFLOW_RETENTION_DAYS:30}
      archive-enabled: ${STOKR_ORDERFLOW_ARCHIVE_ENABLED:false}

    # Logging
    logging:
      debug-enabled: ${STOKR_ORDERFLOW_DEBUG:false}
      trace-enabled: ${STOKR_ORDERFLOW_TRACE:false}

    # Batch intelligence update
    batch-update-enabled: ${STOKR_ORDERFLOW_BATCH_UPDATE_ENABLED:true}
    batch-update-interval: ${STOKR_ORDERFLOW_BATCH_UPDATE_INTERVAL_MS:60000}  # 1 minute

  # ============= CONFIDENCE-BASED DYNAMIC STRATEGY =============
  confidence-strategy:
    # Calculate confidence scores for all Nifty 100 every minute
    calculator-enabled: ${STOKR_CONFIDENCE_CALCULATOR_ENABLED:true}
    calculator-interval: ${STOKR_CONFIDENCE_CALCULATOR_INTERVAL_MS:60000}  # 1 minute

    # Generate signals based on trader-selected thresholds
    generator-enabled: ${STOKR_CONFIDENCE_GENERATOR_ENABLED:true}
    generator-interval: ${STOKR_CONFIDENCE_GENERATOR_INTERVAL_MS:120000}  # 2 minutes
    generator-initial-delay: ${STOKR_CONFIDENCE_GENERATOR_INITIAL_DELAY_MS:70000}  # 70 seconds

logging:
  level:
    root: INFO
    com.stokr: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
