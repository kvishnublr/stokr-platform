# Optional profile for simulation tuning only — does NOT auto-enable simulation.
# Enable at runtime: POST /api/admin/simulation/runtime/enable (ADMIN role).

stokr:
  simulation-mode:
    enabled: false
    bypass-session-guard: true
    bypass-integrity-guard: true
    bypass-safe-startup: true
    simulate-broker-execution: true
    broker-vendor: SIMULATED
    default-execution-mode: PAPER

  execution:
    sync-oms-dispatch: true
