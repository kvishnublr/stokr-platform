# Stokr LITE - Application Properties
spring.application.name=stokr-lite

# Server
server.port=8080

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stokr_lite}
spring.datasource.username=${DB_USER:stokr}
spring.datasource.password=${DB_PASSWORD:stokr}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
stokr.jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-change-in-production-32-chars}
stokr.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
stokr.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}

# CORS
stokr.cors.allowed-origins=${STOKR_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Timezone
stokr.timezone=${TZ:Asia/Kolkata}

# Zerodha (optional)
stokr.zerodha.api-key=${STOKR_ZERODHA_API_KEY:}
stokr.zerodha.api-secret=${STOKR_ZERODHA_API_SECRET:}
stokr.zerodha.redirect-url=${STOKR_ZERODHA_REDIRECT_URL:http://localhost:8080/api/broker/zerodha/callback}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.stokr=INFO
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
