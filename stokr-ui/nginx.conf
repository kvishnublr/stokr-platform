server {
    listen 80;
    server_name _;

    # Docker embedded DNS; resolve upstream at request time so nginx starts if api is not yet registered.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_upstream stokr-api;
        proxy_pass http://$api_upstream:8080;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_warming;
    }

    location @api_warming {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"success":false,"message":"API is starting — retry shortly","error":{"code":"API_WARMING"}}';
    }

    location /v3/ {
        set $api_upstream stokr-api;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $api_upstream stokr-api;
        proxy_pass http://$api_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /adv-enhanced.html {
        return 301 /adv-enhanced-dashboard;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}