# STOKR PROD - DUAL DEPLOYMENT ROUTER
# Routes traffic between EXISTING and NEW designs
# Author: DevOps Team
# Date: 2024-01-15
# Status: PRODUCTION

# ============================================
# UPSTREAM DEFINITIONS
# ============================================

# EXISTING DESIGN (Current/Stable)
upstream existing_trader {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream existing_admin {
    server 127.0.0.1:8081;
    keepalive 32;
}

# NEW DESIGN (Nature Organic - Testing)
upstream new_trader {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream new_admin {
    server 127.0.0.1:8083;
    keepalive 32;
}

# PRODUCTION API
upstream prod_api {
    server 173.249.55.84:8080;
    keepalive 32;
    keepalive_timeout 60s;
}

# ============================================
# MAIN SERVER BLOCK
# ============================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name prod.stokr.in new.stokr.in;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/prod.stokr.in.crt;
    ssl_certificate_key /etc/ssl/private/prod.stokr.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ========================================
    # TRADER PANEL ROUTING
    # ========================================
    location /trader {
        # NEW DESIGN - Explicit Version
        if ($args ~* "v=new") {
            proxy_pass http://new_trader;
            proxy_set_header X-Design-Version "new";
            proxy_set_header X-Router "true";
            break;
        }

        # EXISTING DESIGN - Explicit Version
        if ($args ~* "v=old") {
            proxy_pass http://existing_trader;
            proxy_set_header X-Design-Version "existing";
            proxy_set_header X-Router "true";
            break;
        }

        # DEFAULT: EXISTING (Stable)
        proxy_pass http://existing_trader;
        proxy_set_header X-Design-Version "existing";
        proxy_set_header X-Router "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # ADMIN PANEL ROUTING
    # ========================================
    location /admin {
        # NEW DESIGN - Explicit Version
        if ($args ~* "v=new") {
            proxy_pass http://new_admin;
            proxy_set_header X-Design-Version "new";
            proxy_set_header X-Router "true";
            break;
        }

        # EXISTING DESIGN - Explicit Version
        if ($args ~* "v=old") {
            proxy_pass http://existing_admin;
            proxy_set_header X-Design-Version "existing";
            proxy_set_header X-Router "true";
            break;
        }

        # DEFAULT: EXISTING (Stable)
        proxy_pass http://existing_admin;
        proxy_set_header X-Design-Version "existing";
        proxy_set_header X-Router "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # API PROXY (Both designs use same API)
    # ========================================
    location /api/ {
        proxy_pass http://prod_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================
    # HEALTH CHECKS
    # ========================================
    location /health {
        access_log off;
        return 200 "STOKR Router Healthy\n";
        add_header Content-Type text/plain;
    }

    location /health/existing/trader {
        access_log off;
        proxy_pass http://existing_trader;
        proxy_set_header X-Health-Check "true";
    }

    location /health/existing/admin {
        access_log off;
        proxy_pass http://existing_admin;
        proxy_set_header X-Health-Check "true";
    }

    location /health/new/trader {
        access_log off;
        proxy_pass http://new_trader;
        proxy_set_header X-Health-Check "true";
    }

    location /health/new/admin {
        access_log off;
        proxy_pass http://new_admin;
        proxy_set_header X-Health-Check "true";
    }

    # ========================================
    # STATUS PAGE
    # ========================================
    location /status {
        access_log off;
        return 200 "STOKR Dual Deployment Status\nRouter: ACTIVE\nExisting Design: STABLE\nNew Design: TESTING\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # LOGGING & COMPRESSION
    # ========================================
    access_log /var/log/nginx/stokr-router-access.log combined;
    error_log /var/log/nginx/stokr-router-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json text/javascript
               application/x-javascript application/xml+rss
               application/rss+xml application/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # ========================================
    # PERFORMANCE
    # ========================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=stokr_cache:10m
                    max_size=1g inactive=60m;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_cache stokr_cache;
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================
# HTTP TO HTTPS REDIRECT
# ============================================

server {
    listen 80;
    server_name prod.stokr.in new.stokr.in;
    return 301 https://$server_name$request_uri;
}

# ============================================
# NOTES
# ============================================
#
# URL Parameters:
#   ?v=new    → NEW Design (Nature Organic)
#   ?v=old    → EXISTING Design (Stable)
#   (none)    → DEFAULT: EXISTING Design
#
# Health Checks:
#   /health                    → Router health
#   /health/existing/trader    → Existing Trader
#   /health/existing/admin     → Existing Admin
#   /health/new/trader         → New Trader
#   /health/new/admin          → New Admin
#
# API Proxying:
#   Both designs use same production API
#   API Server: 173.249.55.84:8080
#   All API calls routed through /api/
#
# Rollback:
#   If NEW design breaks, users automatically get EXISTING
#   Just stop the new design services on ports 8082, 8083
#
# Monitoring:
#   Log rotation: daily
#   Error level: warn
#   Access logging: all requests
