spring:
  application:
    name: stokr-lite

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stokr_lite}
    username: ${DB_USERNAME:stokr}
    password: ${DB_PASSWORD:stokr_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:4uJj9/XZRn3bB7mTGI9uJVC3p8XLDwKgbA/RG7Osz90=}
  expiration: 86400000        # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# Broker Configuration
broker:
  zerodha:
    api-key: ${ZERODHA_API_KEY:}
    api-secret: ${ZERODHA_API_SECRET:}
    redirect-uri: ${ZERODHA_REDIRECT_URI:http://localhost:8080/api/brokers/zerodha/callback}
  dhan:
    api-key: ${DHAN_API_KEY:}
    redirect-uri: ${DHAN_REDIRECT_URI:http://localhost:8080/api/brokers/dhan/callback}
  fyers:
    api-key: ${FYERS_API_KEY:}
    redirect-uri: ${FYERS_REDIRECT_URI:http://localhost:8080/api/brokers/fyers/callback}

# Stokr UI base URL (used for OAuth callback redirects)
stokr:
  ui:
    base-url: ${STOKR_UI_BASE_URL:http://localhost:5173}

# Trading Configuration
trading:
  market-open-time: "09:15"
  market-close-time: "15:30"
  eod-squareoff-time: "15:15"
  scan-interval-seconds: 60
  default-cooldown-minutes: 5
  min-trade-gap-minutes: 2
  max-consecutive-losses: 3

# Chartink Execution Configuration
chartink:
  execution:
    enabled: true
    max-positions: 3
    capital: 15000
    default-user-id: 1
    mode: PAPER

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.stokr: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
