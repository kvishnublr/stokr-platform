version: '3.8'

services:
  frontend:
    image: nginx:alpine
    container_name: stokr-lite-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stokr-lite-backend
    environment:
      DB_HOST: db.tzxceqjvzilmnfzvdoet.supabase.co
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-wfKh8p8ISQ63VF40}
      DB_SSLMODE: require
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-very-long-random-secret-key-at-least-256-bits}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      FYERS_API_KEY: ${FYERS_API_KEY:-}
    ports:
      - "8081:8080"
    restart: unless-stopped
