version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stokr-lite-frontend
    ports:
      - "8082:80"
    restart: unless-stopped
    networks:
      - stokr-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stokr-lite-backend
    environment:
      DB_HOST: db.tzxceqjvzilmnfzvdoet.supabase.co
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-wfKh8p8ISQ63VF40}
      DB_SSLMODE: require
      JWT_SECRET: change-this-to-a-very-long-random-secret-key-at-least-256-bits
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-}
      ZERODHA_REDIRECT_URI: ${ZERODHA_REDIRECT_URI:-https://stokr.in/api/brokers/zerodha/callback}
      STOKR_UI_BASE_URL: ${STOKR_UI_BASE_URL:-https://stokr.in}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      FYERS_API_KEY: ${FYERS_API_KEY:-}
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - stokr-net

networks:
  stokr-net:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "172.25.0.0/16"
        - subnet: "fd25::/64"
