services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stokr-lite-frontend
    ports:
      - "8082:80"
    restart: unless-stopped
    networks:
      - stokr-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stokr-lite-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-173.249.55.84}:5432/${DB_NAME:-stokr_lite}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-stokr}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - stokr-net

networks:
  stokr-net:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "172.25.0.0/16"
        - subnet: "fd25::/64"
