services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stokr-lite-frontend
    ports:
      - "8082:80"
    restart: unless-stopped
    networks:
      - stokr-net

  backend:
    image: stokr-lite-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stokr-lite-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://173.249.55.84:5432/stokr_lite}
      SPRING_DATASOURCE_USERNAME: stokr
      SPRING_DATASOURCE_PASSWORD: root123
      JWT_SECRET: change-this-to-a-very-long-random-secret-key-at-least-256-bits
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-}
      ZERODHA_REDIRECT_URI: ${ZERODHA_REDIRECT_URI:-https://stokr.in/api/brokers/zerodha/callback}
      STOKR_UI_BASE_URL: ${STOKR_UI_BASE_URL:-https://stokr.in}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      FYERS_API_KEY: ${FYERS_API_KEY:-}
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - stokr-net

networks:
  stokr-net:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "172.25.0.0/16"
        - subnet: "fd25::/64"
