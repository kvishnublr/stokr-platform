spring:
  application:
    name: stokr-strategy
  datasource:
    url: jdbc:mysql://localhost:3306/stokr_strategy?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8000}
  servlet:
    context-path: /

# INDEX HUNT Configuration (OPTIONS)
index-hunt:
  telegram:
    enabled: true
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id-vishnublr: ${TELEGRAM_CHAT_ID_VISHNUBLR:}
    chat-id-harshvtrade: ${TELEGRAM_CHAT_ID_HARSHVTRADE:}
  paper-trading:
    enabled: true
    slippage-entry-bps: 5      # 0.05% on entry
    slippage-exit-bps: 8       # 0.08% on exit
    monitor-interval-seconds: 5
    t1-timeout-minutes: 15
    max-hold-minutes: 30
  scheduling:
    detect-interval-seconds: 10
    monitor-interval-seconds: 5
    summary-time: "15:35"      # 3:35 PM IST

# S3 & S7 Futures Configuration
futures-strategies:
  s3:
    enabled: true
    name: "S3 VWAP Retest"
    sl-percent: 0.0025         # 0.25%
    target-percent: 0.0060     # 0.60%
  s7:
    enabled: true
    name: "S7 Range Fade Lower"
    sl-percent: 0.0025         # 0.25%
    target-percent: 0.0045     # 0.45%
  paper-trading:
    enabled: true
    slippage-entry-bps: 5      # 0.05% on entry
    slippage-exit-bps: 8       # 0.08% on exit
    monitor-interval-seconds: 5
    max-hold-minutes: 30
  scheduling:
    detect-interval-seconds: 10
    monitor-interval-seconds: 5
    summary-time: "15:35"      # 3:35 PM IST

# ADV_CASH Configuration (EQUITY CASH)
adv-cash:
  enabled: true
  detection:
    interval-seconds: 10
    enabled: true
    trading-start-min: 570      # 9:30 AM IST
    trading-end-min: 900        # 3:00 PM IST
  slippage:
    entry-bps: 5                # 0.05%
    exit-bps: 8                 # 0.08%
  monitoring:
    interval-seconds: 5
    enabled: true
  position-sizing:
    per-trade-amount: 20000     # ₹20,000 per trade
    max-sector-positions: 2
    max-hold-minutes: 120       # 2 hours
  targets:
    target1-percent: 0.007      # 0.7%
    target2-percent: 0.014      # 1.4%
    stop-loss-percent: 0.004    # -0.4%
  deduplication:
    window-minutes: 30
  quality:
    min-threshold: 65
  daily-summary:
    time: "15:35"               # 3:35 PM IST
    timezone: "Asia/Kolkata"

# Kite API Configuration
kite:
  api:
    key: ${KITE_API_KEY:}
    secret: ${KITE_API_SECRET:}
  access:
    token: ${KITE_ACCESS_TOKEN:}
  base-url: https://api.kite.trade
  market-data-url: https://api.kite.trade

logging:
  level:
    root: INFO
    com.stokr: DEBUG
    com.stokr.intraday.detector.IndexHuntDetector: DEBUG
    com.stokr.intraday.service.IndexHuntService: DEBUG
    com.stokr.intraday.service.PaperTradingExecutor: INFO
    com.stokr.intraday.service.IndexHuntTelegramService: INFO
    com.stokr.intraday.scheduler.IndexHuntScheduler: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/stokr-strategy.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---

# Development Profile
spring:
  profiles:
    active: dev
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    com.stokr: DEBUG
    org.springframework.web: DEBUG

---

# Production Profile
spring:
  profiles:
    active: prod
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    com.stokr: INFO
    org.springframework.web: WARN

index-hunt:
  paper-trading:
    enabled: false  # Use live trading in production
