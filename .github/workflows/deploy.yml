name: Auto Deploy to Contabo

on:
  push:
    branches:
      - Release_v1
  workflow_dispatch:

concurrency:
  group: contabo-deploy-release-v1
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 45m
            script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin Release_v1
            git checkout Release_v1
            git pull origin Release_v1
            chmod +x ./deploy.sh ./health-check.sh ./scripts/contabo_poll_deploy.sh ./scripts/contabo_bootstrap_autodeploy.sh
            ./deploy.sh
            ./health-check.sh status || true
            curl -sf http://127.0.0.1:8080/actuator/health
            curl -sf -o /dev/null -w "ui_http=%{http_code}\n" http://127.0.0.1:3000/
