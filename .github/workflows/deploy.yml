name: Auto Deploy to Contabo

on:
  push:
    branches:
      - Release_v8
  workflow_dispatch:

concurrency:
  group: contabo-deploy-release-v8
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH deploy key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci_prepare_deploy_ssh.sh

      - name: Emergency install deploy pubkey (Postgres)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PG_PASSWORD: ${{ secrets.DEPLOY_PG_PASSWORD }}
        run: |
          set -euo pipefail
          export DEPLOY_SSH_PUB="$(tr -d '\r' < deploy/contabo_github_deploy.pub)"
          pip install psycopg2-binary -q
          export DEPLOY_PG_HOST="${DEPLOY_HOST}"
          export DEPLOY_PG_PASSWORD="${DEPLOY_PG_PASSWORD:-root123}"
          python3 scripts/emergency_install_deploy_ssh_key.py

      - name: Deploy on Contabo
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash scripts/ci_ssh_deploy.sh
