name: Repair Deploy SSH Secret

# Publishes the DEPLOY_SSH_KEY public half into deploy/contabo_github_deploy.pub so
# Contabo cron/deploy can install it via scripts/sync_github_deploy_authorized_key.sh.

on:
  workflow_dispatch:
  push:
    branches:
      - Release_v1
    paths:
      - .github/workflows/repair-deploy-ssh.yml

permissions:
  contents: write

jobs:
  publish-deploy-public-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Release_v1

      - name: Prepare SSH deploy key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci_prepare_deploy_ssh.sh

      - name: Commit public key for Contabo sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/contabo_github_deploy.pub
          if git diff --cached --quiet; then
            echo "deploy/contabo_github_deploy.pub already matches DEPLOY_SSH_KEY"
          else
            git commit -m "Sync deploy public key with DEPLOY_SSH_KEY for Contabo authorized_keys"
            git push origin HEAD:Release_v1
          fi

  verify-deploy-ssh:
    needs: publish-deploy-public-key
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSH to Contabo
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/contabo_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "echo SSH_VERIFY_OK && hostname && cd /opt/stokr/stokr-platform && bash scripts/sync_github_deploy_authorized_key.sh"
