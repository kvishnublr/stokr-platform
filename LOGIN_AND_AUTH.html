<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOKR Login - Nature Organic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes organicWave { 0%, 100% { transform: translateY(0px) translateX(0px); } 25% { transform: translateY(-8px) translateX(5px); } 50% { transform: translateY(0px) translateX(10px); } 75% { transform: translateY(8px) translateX(5px); } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes softGlow { 0%, 100% { box-shadow: 0 0 20px rgba(45, 106, 79, 0.3); } 50% { box-shadow: 0 0 40px rgba(45, 106, 79, 0.5); } }

        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #f5faf8, #f0f8f2, #faf5f0, #f8f0f5);
            background-size: 400% 400%;
            animation: organicWave 30s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d5a4a;
        }

        .login-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 248, 0.95));
            border: 2px solid #d4a574;
            border-radius: 20px;
            padding: 60px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(45, 106, 79, 0.15);
            animation: slideInUp 0.8s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #6a8a7a;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2d6a4f;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d4a574;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.4s;
            background: #f8faf8;
            color: #2d5a4a;
            font-weight: 600;
        }

        input:focus {
            outline: none;
            border-color: #2d6a4f;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(45, 106, 79, 0.2);
        }

        input::placeholder {
            color: #9caf88;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
            color: #6a8a7a;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        a {
            color: #2d6a4f;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        a:hover {
            color: #386395;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2d6a4f 0%, #386395 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s;
            animation: softGlow 2.5s ease-in-out infinite;
            margin-bottom: 16px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(45, 106, 79, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            color: #9caf88;
            margin: 24px 0;
            font-size: 13px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #d4a574;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .demo-login {
            background: linear-gradient(135deg, rgba(156, 175, 136, 0.1), rgba(212, 165, 116, 0.1));
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #d4a574;
            text-align: center;
            font-size: 12px;
            color: #6a8a7a;
        }

        .demo-credentials {
            margin-top: 8px;
            font-size: 11px;
            background: #ffffff;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #2d6a4f;
            font-weight: 700;
        }

        .error-message {
            background: rgba(214, 138, 138, 0.1);
            border: 1px solid #d68a8a;
            color: #8b4545;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .success-message {
            background: rgba(156, 175, 136, 0.1);
            border: 1px solid #9caf88;
            color: #3d5a4a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #2d6a4f;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d4a574;
            border-top-color: #2d6a4f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #6a8a7a;
        }

        .signup-link a {
            color: #386395;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🌿</div>
            <div class="title">STOKR</div>
            <div class="subtitle">Nature Inspired Trading Platform</div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="remember-forgot">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="margin: 0;">Remember me</label>
                </div>
                <a href="#forgot">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Login to Dashboard</button>

            <div class="loading" id="loading">
                <span class="spinner"></span>Authenticating...
            </div>
        </form>

        <div class="divider">OR</div>

        <div class="demo-login">
            <strong>Demo Credentials</strong>
            <div class="demo-credentials">
                Email: trader@stokr.in<br>
                Password: demo@123
            </div>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="#signup">Create one</a>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            const loading = document.getElementById('loading');
            const loginForm = document.getElementById('loginForm');

            // Clear previous messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Show loading
            loading.style.display = 'block';
            loginForm.style.display = 'none';

            try {
                // Attempt to login with actual backend
                const response = await fetch('http://173.249.55.84:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        rememberMe: document.getElementById('remember').checked
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();

                    // Store auth token
                    localStorage.setItem('authToken', data.token || data.access_token || 'auth_' + Date.now());
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userName', data.name || email.split('@')[0]);

                    // Show success
                    successMsg.textContent = 'Login successful! Redirecting...';
                    successMsg.style.display = 'block';

                    // Redirect after 1 second
                    setTimeout(() => {
                        window.location.href = '/trader/dashboard.html';
                    }, 1000);
                } else {
                    // Try demo login
                    if (email === 'trader@stokr.in' && password === 'demo@123') {
                        // Demo credentials work
                        localStorage.setItem('authToken', 'demo_token_' + Date.now());
                        localStorage.setItem('userEmail', email);
                        localStorage.setItem('userName', 'Demo Trader');

                        successMsg.textContent = 'Demo login successful! Redirecting...';
                        successMsg.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = '/trader/index.html';
                        }, 1000);
                    } else {
                        throw new Error('Invalid credentials');
                    }
                }
            } catch (error) {
                loading.style.display = 'none';
                loginForm.style.display = 'block';

                errorMsg.textContent = 'Login failed: ' + (error.message || 'Please try again');
                errorMsg.style.display = 'block';

                console.error('Login error:', error);
            }
        }

        // Auto-fill demo credentials button
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is already logged in
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = '/trader/index.html';
            }

            // Demo fill (if user clicks on demo credentials area)
            document.querySelector('.demo-login').addEventListener('click', () => {
                document.getElementById('email').value = 'trader@stokr.in';
                document.getElementById('password').value = 'demo@123';
                document.getElementById('email').focus();
            });
        });
    </script>
</body>
</html>
